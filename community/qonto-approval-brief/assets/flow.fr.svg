<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-approval-brief — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 1 seule écriture · zéro approbation via MCP</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Inventaire des demandes</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization puis list_requests</tspan><tspan x="50" y="180">(paginé ≤ 50) : virements, virements</tspan><tspan x="50" y="199">groupés, cartes — demandeur relié via</tspan><tspan x="50" y="218">list_memberships, bénéficiaire, montant,</tspan><tspan x="50" y="237">motif, date.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Historique du bénéficiaire</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">list_transactions sur 12-24 mois, graphies</tspan><tspan x="435" y="180">du tiers normalisées et fusionnées : déjà</tspan><tspan x="435" y="199">payé N fois ? montants habituels ? cadence</tspan><tspan x="435" y="218">? Un 3e paiement identique ne se juge pas</tspan><tspan x="435" y="237">comme un premier.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Signal IBAN</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">L&#x27;IBAN de la demande comparé aux virements</tspan><tspan x="820" y="180">passés : déjà vu → rassurant, daté. Jamais</tspan><tspan x="820" y="199">vu → signal de vigilance, pas une</tspan><tspan x="820" y="218">accusation — vérification directe avec le</tspan><tspan x="820" y="237">demandeur recommandée.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Cohérence &amp; contexte</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Montant vs médiane historique (×2 alerte,</tspan><tspan x="820" y="436">×4 forte), doublon récent cité, labels et</tspan><tspan x="820" y="455">équipe (list_labels). Devis retrouvé dans</tspan><tspan x="820" y="474">Gmail si connecté — sinon le skill le dit</tspan><tspan x="820" y="493">et continue.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Brief de décision</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Un brief par demande : ✅ recommandé ou 🔶 à</tspan><tspan x="435" y="436">vérifier, chaque affirmation avec sa</tspan><tspan x="435" y="455">preuve (dates, montants, occurrences).</tspan><tspan x="435" y="474">Recommandation ≠ décision : le dirigeant</tspan><tspan x="435" y="493">tranche, toujours.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Refus motivé · approbation SCA</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Refus via decline_request, uniquement</tspan><tspan x="50" y="436">confirmé, motif visible par le demandeur.</tspan><tspan x="50" y="455">Les approbations restent dans l&#x27;app Qonto</tspan><tspan x="50" y="474">avec la SCA du dirigeant — le skill ne</tspan><tspan x="50" y="493">peut pas approuver.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>