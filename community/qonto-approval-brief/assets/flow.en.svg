<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-approval-brief — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · single write · zero MCP approval</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Inventory pending requests</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization then list_requests</tspan><tspan x="50" y="180">(paginated ≤ 50): transfers,</tspan><tspan x="50" y="199">multi-transfers, cards — requester mapped</tspan><tspan x="50" y="218">via list_memberships, beneficiary, amount,</tspan><tspan x="50" y="237">reason, date.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Beneficiary history</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">list_transactions over 12-24 months,</tspan><tspan x="435" y="180">counterparty spellings normalized and</tspan><tspan x="435" y="199">merged: paid N times before? usual</tspan><tspan x="435" y="218">amounts? cadence? A 3rd identical payment</tspan><tspan x="435" y="237">isn&#x27;t judged like a first.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">IBAN signal</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">The request&#x27;s IBAN compared to past</tspan><tspan x="820" y="180">transfers: seen before → reassuring,</tspan><tspan x="820" y="199">dated. Never seen → a vigilance signal,</tspan><tspan x="820" y="218">not an accusation — a direct check with</tspan><tspan x="820" y="237">the requester is recommended.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Coherence &amp; context</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Amount vs the historical median (×2 flag,</tspan><tspan x="820" y="436">×4 strong), recent duplicate cited, labels</tspan><tspan x="820" y="455">and team (list_labels). Quote found in</tspan><tspan x="820" y="474">Gmail when connected — otherwise the skill</tspan><tspan x="820" y="493">says so and continues.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">One decision brief each</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">One brief per request: ✅ recommended or 🔶</tspan><tspan x="435" y="436">verify, every claim with its evidence</tspan><tspan x="435" y="455">(dates, amounts, counts). Recommendation ≠</tspan><tspan x="435" y="474">decision: the owner decides, always.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Motivated decline · SCA approval</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Declines via decline_request, only when</tspan><tspan x="50" y="436">confirmed, reason visible to the</tspan><tspan x="50" y="455">requester. Approvals stay in the Qonto app</tspan><tspan x="50" y="474">behind the owner&#x27;s SCA — the skill cannot</tspan><tspan x="50" y="493">approve.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>