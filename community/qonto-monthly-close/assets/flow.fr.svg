<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-monthly-close — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 100 % lecture seule</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Cadrage du mois</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord : comptes, pays,</tspan><tspan x="50" y="180">forme juridique. Mois à clôturer (défaut :</tspan><tspan x="50" y="199">dernier mois complet), lecture paginée ≤</tspan><tspan x="50" y="218">50 des transactions, plus 3-6 mois</tspan><tspan x="50" y="237">d&#x27;historique pour les baselines.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Justificatifs manquants</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Transactions sans pièce alors qu&#x27;elle est</tspan><tspan x="435" y="180">exigée, priorisées par enjeu : montant et</tspan><tspan x="435" y="199">TVA récupérable en jeu. Score de</tspan><tspan x="435" y="218">complétude du mois. Gmail connecté :</tspan><tspan x="435" y="237">chasse aux reçus proposée dans la boîte</tspan><tspan x="435" y="256">mail.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">TVA du mois</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Collectée depuis les factures clients —</tspan><tspan x="820" y="180">sur les encaissements si</tspan><tspan x="820" y="199">vat_payment_condition = on_receipts —</tspan><tspan x="820" y="218">moins la déductible (somme des vat_amount</tspan><tspan x="820" y="237">des débits, annoncée comme plancher). Net</tspan><tspan x="820" y="256">à provisionner.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Anomalies</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Trois détecteurs comparés à l&#x27;historique :</tspan><tspan x="820" y="436">dépense inhabituelle chez un tiers connu,</tspan><tspan x="820" y="455">doublon de prélèvement (même tiers, même</tspan><tspan x="820" y="474">montant, même mois), nouveau bénéficiaire</tspan><tspan x="820" y="493">jamais vu. Signalé, jamais accusé.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Sans label &amp; impayés</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Transactions sans label : catégorie</tspan><tspan x="435" y="436">proposée depuis la taxonomie list_labels</tspan><tspan x="435" y="455">(cash-flow categories en 403 → fallback</tspan><tspan x="435" y="474">labels). Impayés clients : jours de retard</tspan><tspan x="435" y="493">et historique de paiement par client.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Rapport de clôture</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Scorecard du mois, comparaison vs mois</tspan><tspan x="50" y="436">précédent (top hausses/baisses par poste)</tspan><tspan x="50" y="455">et to-do de régularisation classée par</tspan><tspan x="50" y="474">priorité. Chaque action renvoie vers le</tspan><tspan x="50" y="493">skill dédié qui la traite.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>