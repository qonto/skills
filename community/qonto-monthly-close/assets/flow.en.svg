<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-monthly-close — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · 100% read-only</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Scope the month</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first: accounts, country,</tspan><tspan x="50" y="180">legal form. Month to close (default: last</tspan><tspan x="50" y="199">full calendar month), paginated reads ≤ 50</tspan><tspan x="50" y="218">for the month&#x27;s transactions, plus 3-6</tspan><tspan x="50" y="237">months of history for baselines.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Missing receipts</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Transactions missing a required</tspan><tspan x="435" y="180">attachment, prioritized by stakes: amount</tspan><tspan x="435" y="199">and recoverable VAT at risk. Month</tspan><tspan x="435" y="218">completeness score. Gmail connected:</tspan><tspan x="435" y="237">offers to hunt the inbox for the missing</tspan><tspan x="435" y="256">receipts.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">The month&#x27;s VAT</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Collected from client invoices — on cash</tspan><tspan x="820" y="180">receipts when vat_payment_condition =</tspan><tspan x="820" y="199">on_receipts — minus deductible (summed</tspan><tspan x="820" y="218">vat_amount on the month&#x27;s debits,</tspan><tspan x="820" y="237">disclosed as a floor). Net VAT to</tspan><tspan x="820" y="256">provision.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Anomalies</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Three detectors against history: unusual</tspan><tspan x="820" y="436">spend at a known counterparty, duplicate</tspan><tspan x="820" y="455">direct debit (same payee, same amount,</tspan><tspan x="820" y="474">same month), never-seen-before</tspan><tspan x="820" y="493">beneficiary. Flagged with evidence, never</tspan><tspan x="820" y="512">accused.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Unlabeled &amp; unpaid</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Unlabeled transactions: a category</tspan><tspan x="435" y="436">proposed from the list_labels taxonomy</tspan><tspan x="435" y="455">(cash-flow categories return 403 → labels</tspan><tspan x="435" y="474">fallback). Unpaid client invoices: days</tspan><tspan x="435" y="493">overdue and per-client payment history.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Closing report</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Month scorecard, previous-month comparison</tspan><tspan x="50" y="436">(top category rises and falls) and a</tspan><tspan x="50" y="455">fix-it to-do sorted by priority. Every</tspan><tspan x="50" y="474">action points to the dedicated skill that</tspan><tspan x="50" y="493">handles the follow-through.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>