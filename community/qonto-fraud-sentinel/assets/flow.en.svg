<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-fraud-sentinel — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · single write (card lock)</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Calibrate the baseline</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">3–6 months of paginated history (≤ 50):</tspan><tspan x="50" y="180">mean, max, cadence and typical hours per</tspan><tspan x="50" y="199">normalized counterparty. Under 3 months:</tspan><tspan x="50" y="218">cautious mode announced, false positives</tspan><tspan x="50" y="237">assumed.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Scan the window</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Since the last scan, or the last 48–72 h</tspan><tspan x="435" y="180">on a first run — widened on demand. Debits</tspan><tspan x="435" y="199">only, card transactions dated on</tspan><tspan x="435" y="218">emitted_at, not settled_at (1–2 day</tspan><tspan x="435" y="237">settlement lag).</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Screen the six signals</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Never-seen beneficiary, amount 3×+ the</tspan><tspan x="820" y="180">average, duplicate direct debit, unusual</tspan><tspan x="820" y="199">hour or channel, burst of small card</tspan><tspan x="820" y="218">debits, first SEPA direct debit from a new</tspan><tspan x="820" y="237">creditor.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Ranked, explained alerts</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Every alert: the transaction, the numbered</tspan><tspan x="820" y="436">why (“€612 vs €148 average = ×4.1”), the</tspan><tspan x="820" y="455">recommended action, a severity tag. A</tspan><tspan x="820" y="474">signal ≠ a fraud: the skill says “unusual,</tspan><tspan x="820" y="493">verify”, never more.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Card lock proposed</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">When a card is implicated and only after</tspan><tspan x="435" y="436">explicit confirmation: change_card_status</tspan><tspan x="435" y="455">locks it. Never automatic; unlocking and</tspan><tspan x="435" y="474">definitive opposition stay in the Qonto</tspan><tspan x="435" y="493">app.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Trust memory</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">The user marks legitimate counterparties</tspan><tspan x="50" y="436">(new subscription, insurance…):</tspan><tspan x="50" y="455">remembered, no more never-seen alerts.</tspan><tspan x="50" y="474">Final report: ranked alerts or a numbered</tspan><tspan x="50" y="493">all-clear.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>