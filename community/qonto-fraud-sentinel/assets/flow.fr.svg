<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-fraud-sentinel — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 1 seule écriture (verrouillage carte)</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Calibrage de la baseline</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">3 à 6 mois d&#x27;historique paginé (≤ 50) :</tspan><tspan x="50" y="180">moyenne, max, cadence et horaires typiques</tspan><tspan x="50" y="199">par contrepartie normalisée. Sous 3 mois :</tspan><tspan x="50" y="218">mode prudent annoncé, faux positifs</tspan><tspan x="50" y="237">assumés.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Scan de la fenêtre</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Depuis le dernier scan, ou les dernières</tspan><tspan x="435" y="180">48-72 h au premier passage — élargissable</tspan><tspan x="435" y="199">à la demande. Débits seulement,</tspan><tspan x="435" y="218">transactions carte horodatées sur</tspan><tspan x="435" y="237">emitted_at, pas settled_at.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Crible des 6 signaux</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Bénéficiaire jamais vu, montant ×3+ la</tspan><tspan x="820" y="180">moyenne, prélèvement en double, horaire ou</tspan><tspan x="820" y="199">canal inhabituel, série de petits débits</tspan><tspan x="820" y="218">rapprochés, premier SEPA d&#x27;un nouveau</tspan><tspan x="820" y="237">créancier.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Alertes expliquées et triées</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Chaque alerte : la transaction, le</tspan><tspan x="820" y="436">pourquoi chiffré (« 612 € vs 148 € de</tspan><tspan x="820" y="455">moyenne = ×4,1 »), l&#x27;action recommandée,</tspan><tspan x="820" y="474">une gravité. Un signal ≠ une fraude : «</tspan><tspan x="820" y="493">inhabituel, vérifie ».</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Verrouillage carte proposé</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Si une carte est en cause et seulement</tspan><tspan x="435" y="436">après confirmation explicite :</tspan><tspan x="435" y="455">change_card_status la verrouille. Jamais</tspan><tspan x="435" y="474">automatique ; déblocage et opposition</tspan><tspan x="435" y="493">définitive restent dans l&#x27;app.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Mémoire de confiance</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">L&#x27;utilisateur marque les contreparties</tspan><tspan x="50" y="436">légitimes (nouvel abonnement, assurance…)</tspan><tspan x="50" y="455">: mémorisées, plus d&#x27;alerte « jamais vu ».</tspan><tspan x="50" y="474">Rapport final : alertes triées ou « RAS »</tspan><tspan x="50" y="493">chiffré.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>