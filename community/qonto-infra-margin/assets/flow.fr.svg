<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-infra-margin — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 100 % lecture seule</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Identité &amp; comptes</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord : comptes,</tspan><tspan x="50" y="180">devises, pays. Rien en dur — le skill</tspan><tspan x="50" y="199">s&#x27;adapte à toute organisation. Universel :</tspan><tspan x="50" y="218">l&#x27;analyse infra marche pour tous les pays</tspan><tspan x="50" y="237">Qonto.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Débits infra isolés</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">12-24 mois de débits scannés (pagination ≤</tspan><tspan x="435" y="180">50, 36 mois pour les plans annuels) :</tspan><tspan x="435" y="199">Vercel, Supabase, AWS, OpenAI, Anthropic…</tspan><tspan x="435" y="218">reconnus dès la 1re occurrence, graphies</tspan><tspan x="435" y="237">fusionnées.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Télémétrie produit</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">MCP détectés dynamiquement : Vercel</tspan><tspan x="820" y="180">(projets, déploiements), Supabase (users</tspan><tspan x="820" y="199">via SELECT count lecture seule, table</tspan><tspan x="820" y="218">confirmée), Sentry en option. Absents →</tspan><tspan x="820" y="237">mode dégradé annoncé.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Allocation par projet</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Chaque facture rapprochée d&#x27;un projet</tspan><tspan x="820" y="436">réel. Coûts partagés répartis au prorata</tspan><tspan x="820" y="455">de l&#x27;activité de déploiement — la règle de</tspan><tspan x="820" y="474">répartition est affichée sur la ligne,</tspan><tspan x="820" y="493">jamais silencieuse.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Unit economics</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Coût infra/mois et tendance, €/utilisateur</tspan><tspan x="435" y="436">et €/projet quand une vraie mesure existe,</tspan><tspan x="435" y="455">dérive de marge brute face aux</tspan><tspan x="435" y="474">encaissements. Jamais de métrique produit</tspan><tspan x="435" y="493">inventée.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Side-projects qui saignent</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Projets facturés sans déploiement depuis</tspan><tspan x="50" y="436">90 jours, bases vides sur palier payant,</tspan><tspan x="50" y="455">API IA qui croît plus vite que les users →</tspan><tspan x="50" y="474">rapport chiffré + dashboard HTML.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>