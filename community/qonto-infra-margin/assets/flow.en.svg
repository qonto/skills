<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-infra-margin — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · 100 % read-only</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Identity &amp; accounts</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first: accounts,</tspan><tspan x="50" y="180">currencies, country. Nothing hardcoded —</tspan><tspan x="50" y="199">the skill adapts to any organization.</tspan><tspan x="50" y="218">Universal: infra analysis works for every</tspan><tspan x="50" y="237">Qonto country.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Isolate infra spend</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">12-24 months of debits scanned (pagination</tspan><tspan x="435" y="180">≤ 50, 36 months for yearly plans): Vercel,</tspan><tspan x="435" y="199">Supabase, AWS, OpenAI, Anthropic…</tspan><tspan x="435" y="218">recognized at first occurrence, spellings</tspan><tspan x="435" y="237">merged.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Product telemetry</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">MCPs detected dynamically: Vercel</tspan><tspan x="820" y="180">(projects, deployments), Supabase (users</tspan><tspan x="820" y="199">via read-only SELECT count, confirmed</tspan><tspan x="820" y="218">table), Sentry optional. Absent →</tspan><tspan x="820" y="237">announced degraded mode.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Per-project allocation</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Every bill mapped to a real project.</tspan><tspan x="820" y="436">Shared costs prorated by deployment</tspan><tspan x="820" y="455">activity — the allocation rule is shown on</tspan><tspan x="820" y="474">the line, never silent.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Unit economics</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Infra cost/month and trend, €/user and</tspan><tspan x="435" y="436">€/project when a real measurement exists,</tspan><tspan x="435" y="455">gross-margin drift against receipts. No</tspan><tspan x="435" y="474">product metric is ever invented.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Bleeding side-projects</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Projects billed with zero deployments in</tspan><tspan x="50" y="436">90 days, empty databases on paid tiers, AI</tspan><tspan x="50" y="455">APIs growing faster than users → costed</tspan><tspan x="50" y="474">report + HTML dashboard.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>