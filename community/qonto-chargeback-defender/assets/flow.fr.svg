<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-chargeback-defender — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 1 seule écriture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Détection des litiges</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Via le MCP Stripe/PayPal si connecté</tspan><tspan x="50" y="180">(litiges ouverts, motifs, deadlines) ;</tspan><tspan x="50" y="199">sinon repérage dans Qonto des débits de</tspan><tspan x="50" y="218">reprise : libellés dispute, chargeback,</tspan><tspan x="50" y="237">reversal + frais associés.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Débit retrouvé</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">La reprise est rapprochée de</tspan><tspan x="435" y="180">l&#x27;encaissement d&#x27;origine dans Qonto :</tspan><tspan x="435" y="199">montant, date, contrepartie — la</tspan><tspan x="435" y="218">chronologie complète est reconstituée</tspan><tspan x="435" y="237">(paiement → payout → reprise → frais).</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Deadline de réponse</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">La date limite vient du litige lui-même,</tspan><tspan x="820" y="180">jamais estimée à la légère. Sans MCP</tspan><tspan x="820" y="199">litiges : fenêtres types annoncées comme</tspan><tspan x="820" y="218">indicatives, avec consigne de vérifier sur</tspan><tspan x="820" y="237">le portail.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Dossier de défense</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Commande Shopify, preuve de livraison si</tspan><tspan x="820" y="436">disponible, échanges client Gmail : chaque</tspan><tspan x="820" y="455">pièce listée avec sa source, les</tspan><tspan x="820" y="474">manquantes avec où les trouver. Jamais de</tspan><tspan x="820" y="493">pièce fabriquée.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Mémo attaché à la transaction</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Avec le consentement explicite : mémo de</tspan><tspan x="435" y="436">synthèse daté attaché au débit de reprise</tspan><tspan x="435" y="455">(request_attachment_upload puis upload),</tspan><tspan x="435" y="474">confirmé via list_transaction_attachments.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Toi, tu soumets</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Brouillon de réponse structuré comme le</tspan><tspan x="50" y="436">formulaire du PSP, à déposer sur le</tspan><tspan x="50" y="455">portail Stripe/PayPal avant la deadline.</tspan><tspan x="50" y="474">Le skill prépare, il ne soumet jamais.</tspan><tspan x="50" y="493">Rapport final ✅.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>