<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-chargeback-defender — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · single write</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Detect disputes</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Via the Stripe/PayPal MCP when connected</tspan><tspan x="50" y="180">(open disputes, reasons, deadlines);</tspan><tspan x="50" y="199">otherwise clawback debits spotted in</tspan><tspan x="50" y="218">Qonto: dispute, chargeback, reversal</tspan><tspan x="50" y="237">labels + the paired fee.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Find the debit</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">The clawback is matched to the original</tspan><tspan x="435" y="180">incoming payment in Qonto: amount, date,</tspan><tspan x="435" y="199">counterparty — the full money trail</tspan><tspan x="435" y="218">rebuilt (charge → payout → clawback →</tspan><tspan x="435" y="237">fee).</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">State the deadline</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">The due date comes from the dispute</tspan><tspan x="820" y="180">itself, never loosely estimated. Without a</tspan><tspan x="820" y="199">dispute MCP: typical windows given as</tspan><tspan x="820" y="218">indicative, with a pointer to check the</tspan><tspan x="820" y="237">portal.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Assemble the defense file</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Shopify order, proof of delivery when</tspan><tspan x="820" y="436">available, Gmail customer threads: every</tspan><tspan x="820" y="455">piece listed with its source, missing ones</tspan><tspan x="820" y="474">with where to find them. Nothing ever</tspan><tspan x="820" y="493">fabricated.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Attach the memo</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">With explicit consent: a dated synthesis</tspan><tspan x="435" y="436">memo attached to the clawback debit</tspan><tspan x="435" y="455">(request_attachment_upload then upload),</tspan><tspan x="435" y="474">confirmed via</tspan><tspan x="435" y="493">list_transaction_attachments.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">You submit</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">A response draft structured like the PSP&#x27;s</tspan><tspan x="50" y="436">form, to file on the Stripe/PayPal portal</tspan><tspan x="50" y="455">before the deadline. The skill prepares —</tspan><tspan x="50" y="474">it never submits. Final report ✅.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>