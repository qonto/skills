<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-subscription-audit — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · zero Qonto writes</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Learn from history</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">24–36 months of debits per account,</tspan><tspan x="50" y="180">paginated ≤ 50 — a yearly subscription</tspan><tspan x="50" y="199">needs 2 occurrences. Counterparties</tspan><tspan x="50" y="218">normalized: card prefixes stripped, SEPA</tspan><tspan x="50" y="237">and card variants of one supplier merged.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Inventory the recurring charges</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">A subscription = normalized counterparty +</tspan><tspan x="435" y="180">monthly, quarterly or yearly cadence + ≥ 3</tspan><tspan x="435" y="199">hits (2 for yearly), cards AND direct</tspan><tspan x="435" y="218">debits. The sum = the TOTAL annualized</tspan><tspan x="435" y="237">cost, the shock number.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Statuses and newborns 🌱</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">✅ active · 👥 duplicates · 🧟 zombies</tspan><tspan x="820" y="180">(user-confirmed) · 🎣 trials gone paid —</tspan><tspan x="820" y="199">plus New: notorious subscription merchants</tspan><tspan x="820" y="218">recognized from the very first charge, no</tspan><tspan x="820" y="237">history needed.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Price-hike detection</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">A plateau = ≥ 2 stable charges (±2%); a</tspan><tspan x="820" y="436">hike = a jump persisting ≥ 2 cycles. FX,</tspan><tspan x="820" y="455">VAT (excl-VAT comparison) and variable</tspan><tspan x="820" y="474">usage excluded. Cumulated annual overcost,</tspan><tspan x="820" y="493">🟢🟡🔴 tags vs inflation.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Dashboard</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Markdown tables always; a dashboard</tspan><tspan x="435" y="436">rendered directly in Claude when the host</tspan><tspan x="435" y="455">allows; a self-contained HTML export in</tspan><tspan x="435" y="474">Qonto colors — total cost, categories,</tspan><tspan x="435" y="493">statuses, hikes, 3-month forecast.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Draft emails</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Argued negotiation drafts (tenure, volume,</tspan><tspan x="50" y="436">dated hikes) for the biggest lines + the</tspan><tspan x="50" y="455">monthly digest (actives, month total,</tspan><tspan x="50" y="474">3-month forecast). Gmail drafts or</tspan><tspan x="50" y="493">copy-paste text — never sent.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>