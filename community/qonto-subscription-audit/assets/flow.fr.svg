<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-subscription-audit — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · zéro écriture Qonto</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Analyse de l&#x27;historique</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">24 à 36 mois de débits par compte, paginés</tspan><tspan x="50" y="180">≤ 50 — un abonnement annuel exige 2</tspan><tspan x="50" y="199">occurrences. Contreparties normalisées :</tspan><tspan x="50" y="218">préfixes carte nettoyés, variantes SEPA et</tspan><tspan x="50" y="237">carte fusionnées.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Inventaire des récurrents</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Abonnement = contrepartie normalisée +</tspan><tspan x="435" y="180">cadence mensuelle, trimestrielle ou</tspan><tspan x="435" y="199">annuelle + ≥ 3 occurrences (2 en annuel),</tspan><tspan x="435" y="218">cartes ET prélèvements. La somme = le coût</tspan><tspan x="435" y="237">annuel TOTAL, le chiffre choc.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Statuts et nouveaux 🌱</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">✅ actifs · 👥 doublons · 🧟 zombies</tspan><tspan x="820" y="180">(confirmés par l&#x27;utilisateur) · 🎣 essais</tspan><tspan x="820" y="199">devenus payants — et Nouveaux : marchands</tspan><tspan x="820" y="218">d&#x27;abonnement notoires reconnus dès la 1re</tspan><tspan x="820" y="237">occurrence, sans historique.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Détection des hausses</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Un palier = ≥ 2 prélèvements stables (±2</tspan><tspan x="820" y="436">%) ; une hausse = un saut qui persiste ≥ 2</tspan><tspan x="820" y="455">cycles. Change, TVA (comparaison HT) et</tspan><tspan x="820" y="474">usage variable exclus. Surcoût annuel</tspan><tspan x="820" y="493">cumulé, tags 🟢🟡🔴.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Dashboard</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Tableaux markdown toujours ; dashboard</tspan><tspan x="435" y="436">rendu directement dans Claude quand l&#x27;hôte</tspan><tspan x="435" y="455">le permet ; export HTML autoportant charte</tspan><tspan x="435" y="474">Qonto — coût total, catégories, statuts,</tspan><tspan x="435" y="493">hausses, prévisionnel 3 mois.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Emails en brouillon</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Négo argumentée (ancienneté, volume,</tspan><tspan x="50" y="436">hausses datées) pour les grosses lignes +</tspan><tspan x="50" y="455">digest mensuel (actifs, total du mois,</tspan><tspan x="50" y="474">prévisionnel 3 mois). Brouillons Gmail ou</tspan><tspan x="50" y="493">texte à copier — jamais envoyés.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>