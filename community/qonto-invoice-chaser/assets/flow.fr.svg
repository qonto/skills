<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-invoice-chaser — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · rien ne part sans toi</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Détection des impayés</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization puis list_client_invoices</tspan><tspan x="50" y="180">: factures clients en retard, ancienneté</tspan><tspan x="50" y="199">calculée depuis due_date, encours total et</tspan><tspan x="50" y="218">répartition 0-30 / 31-60 / 60+ jours.</tspan><tspan x="50" y="237">Pagination ≤ 50 partout.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Croisement encaissements</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Chaque facture « unpaid » est confrontée</tspan><tspan x="435" y="180">aux transactions créditrices réelles :</tspan><tspan x="435" y="199">montant exact ±0,01, contrepartie ≈ nom du</tspan><tspan x="435" y="218">client, référence contenant le numéro. Une</tspan><tspan x="435" y="237">facture déjà payée n&#x27;est JAMAIS relancée.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Marquage proposé</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Correspondance forte → le skill montre la</tspan><tspan x="820" y="180">transaction en preuve et propose</tspan><tspan x="820" y="199">mark_client_invoice_as_paid. Confirmation</tspan><tspan x="820" y="218">explicite exigée ; cas ambigus (partiel,</tspan><tspan x="820" y="237">groupé) → candidats présentés, jamais</tspan><tspan x="820" y="256">d&#x27;auto-marquage.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Profil payeur</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Historique du client : factures réglées,</tspan><tspan x="820" y="436">retard moyen, tendance → 🟢 fiable · 🟡</tspan><tspan x="820" y="455">occasionnel · 🔴 chronique. Le ton s&#x27;adapte</tspan><tspan x="820" y="474">— un bon payeur en retard exceptionnel</tspan><tspan x="820" y="493">n&#x27;est pas traité en mauvais payeur.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Relance graduée</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Rappel courtois ~J+7 → relance ferme ~J+21</tspan><tspan x="435" y="436">→ mise en demeure ~J+45 : intérêts de</tspan><tspan x="435" y="455">retard et indemnité forfaitaire de 40 €</tspan><tspan x="435" y="474">(art. L441-10 C. com). Numéro, montant,</tspan><tspan x="435" y="493">jours de retard : chaque chiffre est réel.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Brouillon Gmail &amp; rapport</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">MCP Gmail présent → brouillon créé,</tspan><tspan x="50" y="436">l&#x27;utilisateur relit et envoie ; sinon</tspan><tspan x="50" y="455">texte prêt à copier. Rapport final :</tspan><tspan x="50" y="474">encours, aging, DSO, prochaines relances —</tspan><tspan x="50" y="493">rien ne part sans l&#x27;utilisateur.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>