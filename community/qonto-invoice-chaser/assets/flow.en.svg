<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-invoice-chaser — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · nothing sent without you</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Scan receivables</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization then</tspan><tspan x="50" y="180">list_client_invoices: overdue client</tspan><tspan x="50" y="199">invoices, days late computed from</tspan><tspan x="50" y="218">due_date, total outstanding and the 0-30 /</tspan><tspan x="50" y="237">31-60 / 60+ day aging buckets. Pagination</tspan><tspan x="50" y="256">≤ 50 everywhere.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Cross-check real cash</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Every &quot;unpaid&quot; invoice is checked against</tspan><tspan x="435" y="180">actual credit transactions: exact amount</tspan><tspan x="435" y="199">±0.01, counterparty ≈ client name,</tspan><tspan x="435" y="218">reference containing the number. An</tspan><tspan x="435" y="237">already-paid invoice is NEVER chased.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Proposed marking</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Strong match → the skill shows the</tspan><tspan x="820" y="180">transaction as evidence and proposes</tspan><tspan x="820" y="199">mark_client_invoice_as_paid. Explicit</tspan><tspan x="820" y="218">confirmation required; ambiguous cases</tspan><tspan x="820" y="237">(partial, grouped) → candidates shown,</tspan><tspan x="820" y="256">never auto-marked.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Payer profile</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Client history: invoices paid, average</tspan><tspan x="820" y="436">delay, trend → 🟢 reliable · 🟡 occasional ·</tspan><tspan x="820" y="455">🔴 chronic. The tone adapts — a good payer</tspan><tspan x="820" y="474">having a bad month is not treated like a</tspan><tspan x="820" y="493">chronic late payer.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Graduated reminder</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Courteous nudge ~D+7 → firm reminder ~D+21</tspan><tspan x="435" y="436">→ formal notice ~D+45: late-payment</tspan><tspan x="435" y="455">interest and the €40 recovery indemnity</tspan><tspan x="435" y="474">(art. L441-10). Invoice number, amount,</tspan><tspan x="435" y="493">days overdue: every figure is real.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Gmail draft &amp; report</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Gmail MCP present → a draft is created,</tspan><tspan x="50" y="436">the user reviews and sends; otherwise</tspan><tspan x="50" y="455">copy-ready text. Final report:</tspan><tspan x="50" y="474">outstanding, aging, DSO, upcoming</tspan><tspan x="50" y="493">reminders — nothing leaves without the</tspan><tspan x="50" y="512">user.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>