<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-counterparty-watch — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 100 % lecture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Inventaire des tiers</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Clients via list_clients et factures,</tspan><tspan x="50" y="180">fournisseurs via transactions et factures</tspan><tspan x="50" y="199">fournisseurs. Noms normalisés (mentions</tspan><tspan x="50" y="218">SEPA, suffixes SARL/SAS), SIREN extrait</tspan><tspan x="50" y="237">des fiches clients quand présent.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Encours par tiers</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Factures clients impayées à leur échéance</tspan><tspan x="435" y="180">(montants, ancienneté 0-30 / 31-60 / 61-90</tspan><tspan x="435" y="199">/ 90+ jours), factures fournisseurs à</tspan><tspan x="435" y="218">payer et dépense récurrente annualisée :</tspan><tspan x="435" y="237">ce que chaque tiers pèse vraiment.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Comportement de paiement</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Délai réel de règlement par client : date</tspan><tspan x="820" y="180">de paiement observée vs due_date sur</tspan><tspan x="820" y="199">l&#x27;historique. Retard moyen, pire retard,</tspan><tspan x="820" y="218">tendance — le client qui glisse de 15 à 45</tspan><tspan x="820" y="237">jours sans que personne ne le voie.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Santé légale (Datagouv)</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Si le MCP Datagouv est présent : SIRENE</tspan><tspan x="820" y="436">(radiations, cessations) et BODACC</tspan><tspan x="820" y="455">(redressement, liquidation, sauvegarde)</tspan><tspan x="820" y="474">par SIREN. Absent → le skill le dit et</tspan><tspan x="820" y="493">continue en Qonto pur, sans rien inventer.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Score de risque 🟢🟡🔴</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Croisement encours × santé légale × retard</tspan><tspan x="435" y="436">: chaque tiers reçoit un score justifié en</tspan><tspan x="435" y="455">une ligne. « Vérifié sur BODACC le JJ/MM »</tspan><tspan x="435" y="474">ou « non vérifiable » — jamais de</tspan><tspan x="435" y="493">certitude inventée sur la couverture.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Rapport &amp; alertes</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Tableau de risque trié, alertes</tspan><tspan x="50" y="436">prioritaires croisées (« X te doit N € ET</tspan><tspan x="50" y="455">vient d&#x27;entrer en procédure — relance</tspan><tspan x="50" y="474">aujourd&#x27;hui »), note de couverture,</tspan><tspan x="50" y="493">dashboard HTML optionnel. Zéro écriture.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>