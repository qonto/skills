<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-shopify-bridge — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 0 écriture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Cartographie des encaissements</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">12 à 24 mois de crédits (paginé ≤ 50) : le</tspan><tspan x="50" y="180">skill isole les versements des PSP —</tspan><tspan x="50" y="199">Shopify, Stripe, PayPal, SumUp, Adyen,</tspan><tspan x="50" y="218">Mollie… — les normalise et les regroupe</tspan><tspan x="50" y="237">par prestataire et par boutique.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Rythme des payouts</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Cadence par PSP (quotidienne jours ouvrés,</tspan><tspan x="435" y="180">hebdo, à la demande), délai typique</tspan><tspan x="435" y="199">J+2/J+3, montant habituel → calendrier des</tspan><tspan x="435" y="218">versements attendus. Toute rupture de</tspan><tspan x="435" y="237">rythme devient une alerte documentée.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Enrichissement Shopify</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Si le MCP Shopify est connecté : ventes</tspan><tspan x="820" y="180">brutes, remboursements et commandes par</tspan><tspan x="820" y="199">période (run-analytics-query,</tspan><tspan x="820" y="218">list-orders). Sinon le skill l&#x27;annonce</tspan><tspan x="820" y="237">clairement et continue en mode Qonto pur.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Rapprochement ventes ↔ payouts</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Un payout regroupe n commandes moins frais</tspan><tspan x="820" y="436">moins remboursements, avec délai bancaire.</tspan><tspan x="820" y="455">Le skill matche fenêtres de vente et</tspan><tspan x="820" y="474">versements reçus, puis calcule le taux de</tspan><tspan x="820" y="493">frais effectif : (brut − net) ÷ brut.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Détection des écarts</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Payout annoncé mais jamais arrivé, retard</tspan><tspan x="435" y="436">inhabituel, dérive des frais mois après</tspan><tspan x="435" y="455">mois, remboursement non répercuté : chaque</tspan><tspan x="435" y="474">anomalie est documentée avec ses</tspan><tspan x="435" y="493">références, prête pour un ticket support.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Rapport de réconciliation</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">« 14 payouts attendus, 13 reçus, 1 en</tspan><tspan x="50" y="436">retard de 4 jours » : frais effectifs vs</tspan><tspan x="50" y="455">annoncés, net encaissé du mois, vraie</tspan><tspan x="50" y="474">marge après commissions. Tableaux markdown</tspan><tspan x="50" y="493">+ dashboard HTML si l&#x27;hôte l&#x27;affiche.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>