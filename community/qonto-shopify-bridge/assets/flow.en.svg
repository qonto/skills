<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-shopify-bridge — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · zero writes</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Map the money in</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">12–24 months of credits (paginated ≤ 50):</tspan><tspan x="50" y="180">the skill isolates PSP payouts — Shopify,</tspan><tspan x="50" y="199">Stripe, PayPal, SumUp, Adyen, Mollie… —</tspan><tspan x="50" y="218">normalizes the counterparties and groups</tspan><tspan x="50" y="237">them by provider and by store.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Learn the payout rhythm</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Cadence per PSP (daily on business days,</tspan><tspan x="435" y="180">weekly, on-demand), typical 2–3-day delay,</tspan><tspan x="435" y="199">usual amount band → a calendar of expected</tspan><tspan x="435" y="218">payouts. Every rhythm break becomes a</tspan><tspan x="435" y="237">documented alert.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Enrich with Shopify</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">When the Shopify MCP is connected: gross</tspan><tspan x="820" y="180">sales, refunds and orders per period</tspan><tspan x="820" y="199">(run-analytics-query, list-orders).</tspan><tspan x="820" y="218">Otherwise the skill says so plainly and</tspan><tspan x="820" y="237">continues in Qonto-only mode.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Reconcile sales ↔ payouts</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">A payout groups n orders minus fees minus</tspan><tspan x="820" y="436">refunds, arriving with a banking delay.</tspan><tspan x="820" y="455">The skill matches sales windows to</tspan><tspan x="820" y="474">received payouts and computes the</tspan><tspan x="820" y="493">effective fee rate: (gross − net) ÷ gross.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Detect the gaps</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">A payout claimed but never arrived, an</tspan><tspan x="435" y="436">unusual delay, fee drift month over month,</tspan><tspan x="435" y="455">a refund never passed through: every</tspan><tspan x="435" y="474">anomaly is documented with its references,</tspan><tspan x="435" y="493">ready for a support ticket.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Reconciliation report</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">“14 payouts expected, 13 received, 1 late</tspan><tspan x="50" y="436">by 4 days”: effective vs announced fees,</tspan><tspan x="50" y="455">net cash collected, true margin after</tspan><tspan x="50" y="474">commissions. Markdown tables + an HTML</tspan><tspan x="50" y="493">dashboard when the host renders it.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>