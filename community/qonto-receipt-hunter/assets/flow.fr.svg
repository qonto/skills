<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-receipt-hunter — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 1 seule écriture, confirmée pièce par pièce</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Inventaire des trous</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Scan des transactions (paginé ≤ 50) :</tspan><tspan x="50" y="180">pièce manquante quand attachment_ids est</tspan><tspan x="50" y="199">vide, attachment_required vrai et</tspan><tspan x="50" y="218">attachment_lost faux. Encaissements</tspan><tspan x="50" y="237">clients et pièces non exigées mis de côté.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Classement par urgence</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Chaque trou est scoré : TVA récupérable en</tspan><tspan x="435" y="180">jeu (vat_amount, sinon plafond estimé en</tspan><tspan x="435" y="199">France), montant, ancienneté. En-tête : «</tspan><tspan x="435" y="218">X pièces manquantes, ~Y € de TVA</tspan><tspan x="435" y="237">récupérable en jeu ».</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Chasse Gmail</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Si le MCP Gmail est présent : recherche</tspan><tspan x="820" y="180">par marchand, montant et fenêtre de dates</tspan><tspan x="820" y="199">autour d&#x27;emitted_at (pas settled_at —</tspan><tspan x="820" y="218">délai carte 1-2 j), avec tolérance de</tspan><tspan x="820" y="237">montant (pourboires, devises).</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Chasse Google Drive</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Si le MCP Drive est présent : recherche</tspan><tspan x="820" y="436">des PDF par marchand, date et montant dans</tspan><tspan x="820" y="455">les noms et contenus, téléchargement du</tspan><tspan x="820" y="474">candidat et contrôle de cohérence avant</tspan><tspan x="820" y="493">toute proposition.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Rattachement confirmé</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Match affiché (transaction ↔ document</tspan><tspan x="435" y="436">original), confirmation explicite exigée</tspan><tspan x="435" y="455">pour chaque pièce, puis</tspan><tspan x="435" y="474">request_attachment_upload +</tspan><tspan x="435" y="493">upload_attachment. Jamais en masse, jamais</tspan><tspan x="435" y="512">de document régénéré.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Rapport de chasse</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Rattachées ✅, retrouvées à joindre 📎,</tspan><tspan x="50" y="436">introuvables ❌ avec piste concrète :</tspan><tspan x="50" y="455">portail marchand, boîte secondaire,</tspan><tspan x="50" y="474">collecte auto Qonto, duplicata</tspan><tspan x="50" y="493">fournisseur. Score de complétude</tspan><tspan x="50" y="512">avant/après.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>