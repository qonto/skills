<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-receipt-hunter — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · single write, confirmed per receipt</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Inventory the gaps</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Scans transactions (paginated ≤ 50): a gap</tspan><tspan x="50" y="180">is attachment_ids empty AND</tspan><tspan x="50" y="199">attachment_required true AND</tspan><tspan x="50" y="218">attachment_lost false. Client payments and</tspan><tspan x="50" y="237">not-required transactions are set aside.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Rank by urgency</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Every gap gets a score: recoverable VAT at</tspan><tspan x="435" y="180">stake (vat_amount, else a French ceiling</tspan><tspan x="435" y="199">estimate), amount, age. Headline: “X</tspan><tspan x="435" y="218">missing receipts, ~Y € of recoverable VAT</tspan><tspan x="435" y="237">at stake”.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Hunt Gmail</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">When the Gmail MCP is present: searches by</tspan><tspan x="820" y="180">merchant, amount and a date window around</tspan><tspan x="820" y="199">emitted_at (not settled_at — cards settle</tspan><tspan x="820" y="218">1–2 days late), with amount tolerance</tspan><tspan x="820" y="237">(tips, currencies).</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Hunt Google Drive</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">When the Drive MCP is present: searches</tspan><tspan x="820" y="436">PDFs by merchant, date and amount in names</tspan><tspan x="820" y="455">and contents, downloads the candidate and</tspan><tspan x="820" y="474">checks amount/date coherence before</tspan><tspan x="820" y="493">proposing anything.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Confirmed attaching</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">The match is shown (transaction ↔ original</tspan><tspan x="435" y="436">document), explicit confirmation required</tspan><tspan x="435" y="455">per receipt, then</tspan><tspan x="435" y="474">request_attachment_upload +</tspan><tspan x="435" y="493">upload_attachment. Never in bulk, never a</tspan><tspan x="435" y="512">regenerated document.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Hunt report</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Attached ✅, found-to-attach 📎, not found ❌</tspan><tspan x="50" y="436">with one concrete lead each: merchant</tspan><tspan x="50" y="455">portal, secondary inbox, Qonto</tspan><tspan x="50" y="474">auto-collection, supplier duplicate.</tspan><tspan x="50" y="493">Completeness score before/after.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>