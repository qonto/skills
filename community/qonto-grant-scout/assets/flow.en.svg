<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-grant-scout — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · zero writes</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Profile the company</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first: legal form, sector</tspan><tspan x="50" y="180">(NAF code when present), region, company</tspan><tspan x="50" y="199">age, size. When the sector is missing, the</tspan><tspan x="50" y="218">skill infers it from the flows — and says</tspan><tspan x="50" y="237">so, with a confidence level.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Read the real flows</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">12–24 months of transactions (paginated ≤</tspan><tspan x="435" y="180">50) plus labels: spending is classified —</tspan><tspan x="435" y="199">training, equipment, digital, hiring,</tspan><tspan x="435" y="218">export, energy — and every category is</tspan><tspan x="435" y="237">priced in €/year with its evidence.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Extract aidable signals</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Every significant category becomes a</tspan><tspan x="820" y="180">dated, quantified signal: €800/month on</tspan><tspan x="820" y="199">training, an equipment purchase, growing</tspan><tspan x="820" y="218">payroll, foreign clients — each one an</tspan><tspan x="820" y="237">angle to hunt public aid schemes with.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Search Datagouv</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">When the Datagouv MCP is present:</tspan><tspan x="820" y="436">search_datasets across the aid</tspan><tspan x="820" y="455">referentials (national aid base, ADEME,</tspan><tspan x="820" y="474">France Num, regions), get_dataset_info for</tspan><tspan x="820" y="493">the update date, query_resource_data to</tspan><tspan x="820" y="512">filter the rows.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Cross and shortlist</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Signals × schemes: every lead carries what</tspan><tspan x="435" y="436">it covers, why the account matches it, the</tspan><tspan x="435" y="455">eligibility criteria left to confirm, the</tspan><tspan x="435" y="474">source with its dataset date, and one</tspan><tspan x="435" y="493">concrete next step to take.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Report honestly</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">A shortlist ranked by plausibility — never</tspan><tspan x="50" y="436">“you are eligible”, always “worth</tspan><tspan x="50" y="455">checking, here&#x27;s why”. Without Datagouv:</tspan><tspan x="50" y="474">spending profile + generic aid families</tspan><tspan x="50" y="493">and the right official portals to explore.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>