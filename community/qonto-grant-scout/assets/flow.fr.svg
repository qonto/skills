<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-grant-scout — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 0 écriture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Profil réel de l&#x27;entreprise</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord : forme</tspan><tspan x="50" y="180">juridique, secteur (code NAF s&#x27;il est</tspan><tspan x="50" y="199">présent), région, ancienneté, taille. Si</tspan><tspan x="50" y="218">le secteur manque, le skill l&#x27;infère des</tspan><tspan x="50" y="237">flux — et le dit, avec un niveau de</tspan><tspan x="50" y="256">confiance.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Lecture des flux réels</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">12 à 24 mois de transactions (paginé ≤ 50)</tspan><tspan x="435" y="180">+ labels : les dépenses sont classées —</tspan><tspan x="435" y="199">formation, matériel, numérique, embauche,</tspan><tspan x="435" y="218">export, énergie — et chaque poste est</tspan><tspan x="435" y="237">chiffré en €/an avec ses preuves.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Signaux « aidables »</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Chaque poste significatif devient un</tspan><tspan x="820" y="180">signal daté et chiffré : 800 €/mois de</tspan><tspan x="820" y="199">formation, un investissement matériel, une</tspan><tspan x="820" y="218">masse salariale qui monte, des clients</tspan><tspan x="820" y="237">étrangers — autant d&#x27;angles pour chercher</tspan><tspan x="820" y="256">des aides.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Recherche Datagouv</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Si le MCP Datagouv est présent :</tspan><tspan x="820" y="436">search_datasets sur les référentiels</tspan><tspan x="820" y="455">d&#x27;aides (aides-entreprises, ADEME, France</tspan><tspan x="820" y="474">Num, régions), get_dataset_info pour la</tspan><tspan x="820" y="493">date de mise à jour, query_resource_data</tspan><tspan x="820" y="512">pour filtrer.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Croisement &amp; shortlist</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Signaux × dispositifs : chaque piste porte</tspan><tspan x="435" y="436">ce qu&#x27;elle couvre, pourquoi le compte y</tspan><tspan x="435" y="455">correspond, les critères d&#x27;éligibilité à</tspan><tspan x="435" y="474">confirmer, la source avec la date du</tspan><tspan x="435" y="493">dataset et la prochaine étape concrète.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Rapport honnête</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Shortlist classée par plausibilité —</tspan><tspan x="50" y="436">jamais « tu es éligible », toujours «</tspan><tspan x="50" y="455">piste à vérifier ». Sans Datagouv : profil</tspan><tspan x="50" y="474">de dépenses + familles d&#x27;aides génériques</tspan><tspan x="50" y="493">et les bons portails officiels à explorer.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>