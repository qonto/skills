<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-true-margin — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">0 Qonto writes · validated prices</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Real costs from the bank</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">12–24 months of Qonto debits classified:</tspan><tspan x="50" y="180">PSP fees actually charged (or “unknown,</tspan><tspan x="50" y="199">not zero” when netted), FX, carriers,</tspan><tspan x="50" y="218">supplier purchases</tspan><tspan x="50" y="237">(list_supplier_invoices).</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Per-product sales</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Shopify MCP connected: revenue, units and</tspan><tspan x="435" y="180">refunds per product, current prices.</tspan><tspan x="435" y="199">Otherwise, announced degraded mode: global</tspan><tspan x="435" y="218">margin by cost family, no product</tspan><tspan x="435" y="237">granularity.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Heuristic allocation</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Real costs spread across products pro-rata</tspan><tspan x="820" y="180">to revenue or units — method chosen by the</tspan><tspan x="820" y="199">user and printed on every table. A stated</tspan><tspan x="820" y="218">estimate, never claimed exact.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">True margin per product</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Contribution margin = net revenue − COGS −</tspan><tspan x="820" y="436">PSP − FX − shipping. Quantified gap vs the</tspan><tspan x="820" y="455">dashboard&#x27;s theoretical margin;</tspan><tspan x="820" y="474">loss-making products flagged first.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Suggested new prices</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Break-even + target price for the margin</tspan><tspan x="435" y="436">the user wants (asked, never assumed). A</tspan><tspan x="435" y="455">number, not a strategy: price elasticity</tspan><tspan x="435" y="474">is not modeled — said honestly.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Validated application</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">No price applied without explicit</tspan><tspan x="50" y="436">line-by-line validation. Each confirmed</tspan><tspan x="50" y="455">product: update-product in Shopify, then</tspan><tspan x="50" y="474">re-read before reporting. Before/after</tspan><tspan x="50" y="493">report.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>