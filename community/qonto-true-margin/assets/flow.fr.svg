<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-true-margin — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">0 écriture Qonto · prix validés</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Coûts réels du compte</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">12-24 mois de débits Qonto classés : frais</tspan><tspan x="50" y="180">PSP réellement prélevés (ou « inconnus,</tspan><tspan x="50" y="199">pas nuls » si nettés), change,</tspan><tspan x="50" y="218">transporteurs, achats fournisseurs</tspan><tspan x="50" y="237">(list_supplier_invoices).</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Ventes par produit</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">MCP Shopify connecté : CA, unités et</tspan><tspan x="435" y="180">remboursements par produit, prix actuels.</tspan><tspan x="435" y="199">Sinon, mode dégradé annoncé : marge</tspan><tspan x="435" y="218">globale par famille de coûts, sans</tspan><tspan x="435" y="237">granularité produit.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Allocation heuristique</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Coûts réels répartis par produit au</tspan><tspan x="820" y="180">prorata du CA ou des unités — méthode</tspan><tspan x="820" y="199">choisie par l&#x27;utilisateur et affichée sur</tspan><tspan x="820" y="218">chaque tableau. Une estimation assumée,</tspan><tspan x="820" y="237">jamais de l&#x27;exactitude.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Marge réelle par produit</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Marge de contribution = CA net − COGS −</tspan><tspan x="820" y="436">PSP − change − transport. Écart chiffré vs</tspan><tspan x="820" y="455">la marge « théorique » du dashboard,</tspan><tspan x="820" y="474">produits vendus à perte signalés en</tspan><tspan x="820" y="493">premier.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Nouveaux prix proposés</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Prix de couverture + prix cible pour la</tspan><tspan x="435" y="436">marge visée (demandée, jamais supposée).</tspan><tspan x="435" y="455">Une suggestion chiffrée, pas une stratégie</tspan><tspan x="435" y="474">: l&#x27;élasticité n&#x27;est pas modélisée — dit</tspan><tspan x="435" y="493">honnêtement.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Application validée</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Aucun prix appliqué sans validation</tspan><tspan x="50" y="436">explicite ligne à ligne. Chaque produit</tspan><tspan x="50" y="455">confirmé : update-product dans Shopify,</tspan><tspan x="50" y="474">puis relecture avant d&#x27;annoncer. Rapport</tspan><tspan x="50" y="493">avant/après.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>