<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-tax-pilot — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 1 seule écriture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Analyse de l&#x27;historique</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Jusqu&#x27;à 36 mois de transactions (2</tspan><tspan x="50" y="180">exercices passés) : récurrences, paiements</tspan><tspan x="50" y="199">DGFIP, régime ET périodicité de TVA</tspan><tspan x="50" y="218">détectés (mensuelle, trimestrielle,</tspan><tspan x="50" y="237">acomptes), débits ou encaissements.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Échéancier fiscal chiffré</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Quand tombe chaque impôt et combien : TVA,</tspan><tspan x="435" y="180">acomptes et solde d&#x27;IS, CFE, PFU</tspan><tspan x="435" y="199">dividendes — chaque ligne avec un tag de</tspan><tspan x="435" y="218">confiance 🟢🟡🔵.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Projection 90 jours</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Trésorerie jour par jour et par compte :</tspan><tspan x="820" y="180">point bas daté, franchissements de seuils,</tspan><tspan x="820" y="199">simulations « et si » (client en retard,</tspan><tspan x="820" y="218">achat exceptionnel).</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Provision du mois</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">TVA nette (collectée sur encaissements −</tspan><tspan x="820" y="436">déductible) + IS/12 + CFE/12 → montant</tspan><tspan x="820" y="455">exact à mettre de côté, détail affiché.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Demande de virement</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Avec le consentement explicite de</tspan><tspan x="435" y="436">l&#x27;utilisateur : demande de virement vers</tspan><tspan x="435" y="455">le sous-compte impôts. Le détail du calcul</tspan><tspan x="435" y="474">est joint dans la note.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Approbation SCA</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Notification push Qonto → l&#x27;utilisateur</tspan><tspan x="50" y="436">approuve avec sa 2FA dans l&#x27;app. L&#x27;argent</tspan><tspan x="50" y="455">bouge SEULEMENT ici. Rapport final :</tspan><tspan x="50" y="474">échéancier couvert ✅.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>