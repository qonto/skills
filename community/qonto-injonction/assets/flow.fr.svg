<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-injonction — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 0 écriture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Cibler la facture</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord, puis la facture</tspan><tspan x="50" y="180">impayée choisie avec l&#x27;utilisateur :</tspan><tspan x="50" y="199">montants, échéance, jours de retard,</tspan><tspan x="50" y="218">identité du débiteur (get_client) — SIREN</tspan><tspan x="50" y="237">confirmé, jamais supposé.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Prouver le non-paiement</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Scan des crédits depuis l&#x27;émission</tspan><tspan x="435" y="180">(list_transactions, paginé ≤ 50) : aucun</tspan><tspan x="435" y="199">encaissement ne matche. Les paiements</tspan><tspan x="435" y="218">partiels sont détectés et déduits du</tspan><tspan x="435" y="237">principal réclamé.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Vérification BODACC</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">API publique, sans clé : le SIREN du</tspan><tspan x="820" y="180">débiteur est cherché dans les procédures</tspan><tspan x="820" y="199">collectives. Procédure ouverte → PAS</tspan><tspan x="820" y="218">d&#x27;injonction : bascule en déclaration de</tspan><tspan x="820" y="237">créance (délai 2 mois).</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Tribunal compétent</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Siège social du débiteur via</tspan><tspan x="820" y="436">recherche-entreprises.api.gouv.fr (sans</tspan><tspan x="820" y="455">clé) → greffe du tribunal de commerce</tspan><tspan x="820" y="474">compétent. L&#x27;état administratif de la</tspan><tspan x="820" y="493">société est vérifié au passage.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Chiffrer la créance</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Principal − acomptes + intérêts de retard</tspan><tspan x="435" y="436">(taux contractuel, sinon BCE + 10 pts,</tspan><tspan x="435" y="455">plancher 3× le taux légal — art. L441-10)</tspan><tspan x="435" y="474">+ indemnité de 40 € par facture. Calcul</tspan><tspan x="435" y="493">détaillé affiché.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Dossier prêt à signer</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">CERFA 12946 pré-rempli champ par champ,</tspan><tspan x="50" y="436">bordereau de pièces numéroté</tspan><tspan x="50" y="455">(justificatifs Qonto via get_attachment),</tspan><tspan x="50" y="474">mode d&#x27;emploi Infogreffe (~35 €, PDF &lt; 2</tspan><tspan x="50" y="493">Mo). Il ne reste qu&#x27;à signer.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>