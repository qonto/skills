<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-accountant-handoff — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · zero Qonto writes</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Scope the period</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first: accounts, country.</tspan><tspan x="50" y="180">Previous complete month by default (or a</tspan><tspan x="50" y="199">quarter), detection of the Google Drive</tspan><tspan x="50" y="218">and Gmail MCPs — present or not, the skill</tspan><tspan x="50" y="237">says so.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Pull the statements</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">list_statements then get_statement for</tspan><tspan x="435" y="180">every account: the official PDFs, ready to</tspan><tspan x="435" y="199">file. An account with no statement (month</tspan><tspan x="435" y="218">not closed) is flagged, never papered</tspan><tspan x="435" y="237">over.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Receipt status</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Every transaction checked against its</tspan><tspan x="820" y="180">attachments: ✅ attached · ⚠️ missing · ➖</tspan><tspan x="820" y="199">not needed. The precise missing list goes</tspan><tspan x="820" y="218">into the pack — and straight to</tspan><tspan x="820" y="237">receipt-hunter.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Factual annotations</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Labels, VAT, plain-language notes (“this</tspan><tspan x="820" y="436">refund matches the May 12 payment”). Never</tspan><tspan x="820" y="455">bookkeeping: no accounting entry is</tspan><tspan x="820" y="474">invented — the accountant stays the pro.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Invoices &amp; handoff letter</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Client and supplier invoices for the</tspan><tspan x="435" y="436">period, with statuses. Then the drafted</tspan><tspan x="435" y="455">letter: the month in ten lines, the 2-3</tspan><tspan x="435" y="474">points worth attention, and the open</tspan><tspan x="435" y="493">questions.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">File &amp; recap</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">An Accounting/YYYY/MM tree on Google Drive</tspan><tspan x="50" y="436">when the MCP is present (otherwise a</tspan><tspan x="50" y="455">structured local pack) + a Gmail recap</tspan><tspan x="50" y="474">draft — nothing is sent without the user.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>