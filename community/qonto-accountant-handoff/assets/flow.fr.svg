<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-accountant-handoff — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · zéro écriture Qonto</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Cadrage de la période</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord : comptes, pays.</tspan><tspan x="50" y="180">Mois précédent par défaut (ou trimestre),</tspan><tspan x="50" y="199">détection des MCP Google Drive et Gmail —</tspan><tspan x="50" y="218">présents ou non, le skill le dit et</tspan><tspan x="50" y="237">continue.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Relevés de la période</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">list_statements puis get_statement pour</tspan><tspan x="435" y="180">chaque compte : les relevés officiels en</tspan><tspan x="435" y="199">PDF, prêts à classer. Un compte sans</tspan><tspan x="435" y="218">relevé (mois non clos) est signalé, jamais</tspan><tspan x="435" y="237">masqué.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">État des justificatifs</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Chaque transaction croisée avec ses pièces</tspan><tspan x="820" y="180">: ✅ complète · ⚠️ manquante · ➖ sans</tspan><tspan x="820" y="199">objet. La liste précise des manquants part</tspan><tspan x="820" y="218">dans le pack — et vers receipt-hunter.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Annotations factuelles</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Labels, TVA, notes utiles au comptable («</tspan><tspan x="820" y="436">ce remboursement correspond au paiement du</tspan><tspan x="820" y="455">12/05 »). Jamais d&#x27;imputation ni</tspan><tspan x="820" y="474">d&#x27;écriture comptable inventée — le</tspan><tspan x="820" y="493">comptable reste le pro.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Factures &amp; lettre de passation</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Factures clients et fournisseurs de la</tspan><tspan x="435" y="436">période, avec statuts. Puis la lettre</tspan><tspan x="435" y="455">rédigée : le mois en 10 lignes, les 2-3</tspan><tspan x="435" y="474">points d&#x27;attention, les questions en</tspan><tspan x="435" y="493">attente de réponse.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Dépôt &amp; récap</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Arborescence Comptabilité/AAAA/MM sur</tspan><tspan x="50" y="436">Google Drive si le MCP est là (sinon pack</tspan><tspan x="50" y="455">local structuré) + brouillon d&#x27;email récap</tspan><tspan x="50" y="474">au cabinet via Gmail — rien ne part sans</tspan><tspan x="50" y="493">toi.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>