<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-crew-onboard — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · écritures confirmées une à une</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Photographie du compte</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord, puis</tspan><tspan x="50" y="180">get_authenticated_membership : rôle du</tspan><tspan x="50" y="199">demandeur vérifié (Admin/Owner requis pour</tspan><tspan x="50" y="218">écrire). Membres, équipes, cartes lus ;</tspan><tspan x="50" y="237">MCP optionnels détectés.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Policy par rôle</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Définie une fois avec l&#x27;utilisateur : type</tspan><tspan x="435" y="180">de carte, plafonds, online-only, équipe</tspan><tspan x="435" y="199">par rôle. Jamais inventée. Limite de</tspan><tspan x="435" y="218">membres du plan vérifiée avant d&#x27;inviter</tspan><tspan x="435" y="237">(plan demandé).</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Une phrase</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">« Alex arrive lundi comme dev » : prénom,</tspan><tspan x="820" y="180">rôle, date extraits ; l&#x27;email est demandé,</tspan><tspan x="820" y="199">jamais deviné. Récapitulatif complet de</tspan><tspan x="820" y="218">tout ce qui va être créé, affiché AVANT</tspan><tspan x="820" y="237">toute écriture.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Onboarding exécuté</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Chaque écriture confirmée une à une :</tspan><tspan x="820" y="436">create_membership (l&#x27;invitation part),</tspan><tspan x="820" y="455">create_team si nouvelle équipe,</tspan><tspan x="820" y="474">create_card_request — une DEMANDE de carte</tspan><tspan x="820" y="493">plafonnée, jamais une carte active.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Pack d&#x27;accueil</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Si les MCP sont là : page d&#x27;accueil</tspan><tspan x="435" y="436">Notion, événement J1 Google Calendar,</tspan><tspan x="435" y="455">brouillon Gmail de bienvenue (jamais</tspan><tspan x="435" y="474">envoyé). MCP absent : annoncé, le cœur</tspan><tspan x="435" y="493">Qonto continue.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Offboarding miroir</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">« Sam part vendredi » : cartes gelées via</tspan><tspan x="50" y="436">change_card_status (confirmé, réversible)</tspan><tspan x="50" y="455">+ checklist de récupération. Rien de</tspan><tspan x="50" y="474">supprimé — les révocations définitives se</tspan><tspan x="50" y="493">font dans l&#x27;app.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>