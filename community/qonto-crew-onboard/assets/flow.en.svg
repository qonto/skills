<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-crew-onboard — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · writes confirmed one by one</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Account snapshot</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first, then</tspan><tspan x="50" y="180">get_authenticated_membership: requester&#x27;s</tspan><tspan x="50" y="199">role checked (Admin/Owner needed to</tspan><tspan x="50" y="218">write). Members, teams, cards read;</tspan><tspan x="50" y="237">optional MCPs detected.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Per-role policy</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Defined once with the user: card type,</tspan><tspan x="435" y="180">caps, online-only, team per role. Never</tspan><tspan x="435" y="199">invented. Plan member limit checked before</tspan><tspan x="435" y="218">inviting (the plan is asked, members</tspan><tspan x="435" y="237">counted).</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">One sentence</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">&quot;Alex starts Monday as a developer&quot;: name,</tspan><tspan x="820" y="180">role, start date extracted; the email is</tspan><tspan x="820" y="199">asked for, never guessed. Full recap of</tspan><tspan x="820" y="218">everything to be created, shown BEFORE any</tspan><tspan x="820" y="237">write.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Onboarding executed</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Every write confirmed one by one:</tspan><tspan x="820" y="436">create_membership (the invitation goes</tspan><tspan x="820" y="455">out), create_team if the team is new,</tspan><tspan x="820" y="474">create_card_request — a capped card</tspan><tspan x="820" y="493">REQUEST, never an active card.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Welcome pack</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">When the MCPs are connected: Notion</tspan><tspan x="435" y="436">welcome page, day-1 Google Calendar event,</tspan><tspan x="435" y="455">Gmail welcome draft (never sent). MCP</tspan><tspan x="435" y="474">absent: announced, the Qonto core</tspan><tspan x="435" y="493">continues.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Mirror offboarding</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">&quot;Sam is leaving Friday&quot;: cards frozen via</tspan><tspan x="50" y="436">change_card_status (confirmed, reversible)</tspan><tspan x="50" y="455">+ recovery checklist. Nothing deleted —</tspan><tspan x="50" y="474">definitive revocations happen in the app.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>