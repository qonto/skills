<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-support-cashdesk — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · chaque écriture confirmée</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Lecture de la conversation</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Depuis Intercom si le MCP est connecté,</tspan><tspan x="50" y="180">sinon collée dans le chat : le skill</tspan><tspan x="50" y="199">extrait la demande (facture, lien,</tspan><tspan x="50" y="218">doublon), les indices d&#x27;identité et les</tspan><tspan x="50" y="237">montants cités.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Matching du client</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">list_clients par email d&#x27;abord, puis</tspan><tspan x="435" y="180">nom/société normalisés. Les candidats sont</tspan><tspan x="435" y="199">montrés et confirmés par l&#x27;utilisateur —</tspan><tspan x="435" y="218">jamais d&#x27;action sur un client deviné.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Vérification des faits</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Factures du client (statuts, dates), état</tspan><tspan x="820" y="180">réel du lien de paiement (ouvert, expiré,</tspan><tspan x="820" y="199">payé) et encaissements dans les</tspan><tspan x="820" y="218">transactions — la réalité Qonto, pas la</tspan><tspan x="820" y="237">mémoire du client.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Diagnostic prouvé</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Facture jamais reçue, lien expiré ou</tspan><tspan x="820" y="436">double encaissement : chaque conclusion</tspan><tspan x="820" y="455">cite sa preuve (deux crédits datés pour un</tspan><tspan x="820" y="474">doublon). Un seul crédit trouvé → pas</tspan><tspan x="820" y="493">d&#x27;avoir.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Action jointe</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Après confirmation, selon le cas : renvoi</tspan><tspan x="435" y="436">de la facture, nouveau lien de paiement,</tspan><tspan x="435" y="455">ou avoir (create_credit_note) si le</tspan><tspan x="435" y="474">doublon est prouvé par les transactions.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Réponse au client</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Brouillon factuel à relire : excuses si</tspan><tspan x="50" y="436">l&#x27;erreur est avérée, correction jointe</tspan><tspan x="50" y="455">(facture, lien, avoir). Brouillon Gmail si</tspan><tspan x="50" y="474">le MCP est présent, sinon à copier-coller.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>