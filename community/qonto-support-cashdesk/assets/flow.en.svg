<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-support-cashdesk — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · every write confirmed</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Read the conversation</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">From Intercom when that MCP is connected,</tspan><tspan x="50" y="180">otherwise pasted into the chat: the skill</tspan><tspan x="50" y="199">extracts the claim (invoice, link,</tspan><tspan x="50" y="218">duplicate), identity clues and quoted</tspan><tspan x="50" y="237">amounts.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Match the client</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">list_clients by email first, then</tspan><tspan x="435" y="180">normalized name/company. Candidates are</tspan><tspan x="435" y="199">shown and confirmed by the user — never an</tspan><tspan x="435" y="218">action on a guessed client.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Check the facts</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">The client&#x27;s invoices (status, dates), the</tspan><tspan x="820" y="180">payment link&#x27;s real state (open, expired,</tspan><tspan x="820" y="199">paid) and incoming credits in the</tspan><tspan x="820" y="218">transactions — Qonto&#x27;s reality, not the</tspan><tspan x="820" y="237">customer&#x27;s memory.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Evidence-based diagnosis</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Invoice never received, expired link or</tspan><tspan x="820" y="436">double collection: every conclusion cites</tspan><tspan x="820" y="455">its proof (two dated credits for a</tspan><tspan x="820" y="474">duplicate). One credit found → no credit</tspan><tspan x="820" y="493">note.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Fix attached</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">After confirmation, case by case: resend</tspan><tspan x="435" y="436">the invoice, create a fresh payment link,</tspan><tspan x="435" y="455">or a credit note (create_credit_note) when</tspan><tspan x="435" y="474">the duplicate is proven by transactions.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Customer reply</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">A factual draft to review: apology when</tspan><tspan x="50" y="436">the error is proven, the fix attached</tspan><tspan x="50" y="455">(invoice, link, credit note). Gmail draft</tspan><tspan x="50" y="474">when that MCP is present, otherwise</tspan><tspan x="50" y="493">copy-paste.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>