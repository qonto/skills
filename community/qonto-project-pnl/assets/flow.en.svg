<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-project-pnl — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · zero Qonto writes</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Read the account</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization then list_labels</tspan><tspan x="50" y="180">(paginated ≤ 50): the label tree = the</tspan><tspan x="50" y="199">candidate projects. 24-36 months of</tspan><tspan x="50" y="218">history so annual renewals show up, not</tspan><tspan x="50" y="237">just monthly ones.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Label ↔ project mapping</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Proposed table (label → project → Notion</tspan><tspan x="435" y="180">page → clients), ALWAYS shown and</tspan><tspan x="435" y="199">confirmed, then remembered. No labels:</tspan><tspan x="435" y="218">proposal from recurring counterparties,</tspan><tspan x="435" y="237">all tagged 🟡.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Cashed revenue</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Paid client invoices matched to credits</tspan><tspan x="820" y="180">(amount + dates + counterparty), matching</tspan><tspan x="820" y="199">confirmed. An unpaid invoice is never</tspan><tspan x="820" y="218">revenue — past due, it becomes an ⚠️</tspan><tspan x="820" y="237">alert.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Attributed costs + P&amp;L</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Debits grouped by mapped label, refunds</tspan><tspan x="820" y="436">deducted, orphans listed separately. Per</tspan><tspan x="820" y="455">project: margin (€ and %), 3-month average</tspan><tspan x="820" y="474">monthly burn, confidence tags 🟢🟡.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Quantified alerts</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Overdue invoice (past its due date),</tspan><tspan x="435" y="436">unusual cost (month &gt; 1.5× the project&#x27;s</tspan><tspan x="435" y="455">6-month average, transactions listed),</tspan><tspan x="435" y="474">negative margin — every alert sourced.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Notion write</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">With explicit consent: a dedicated,</tspan><tspan x="50" y="436">generated-marked “Finance” database, one</tspan><tspan x="50" y="455">entry per project, updated in place on</tspan><tspan x="50" y="474">every run — never a duplicate, never an</tspan><tspan x="50" y="493">overwrite.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>