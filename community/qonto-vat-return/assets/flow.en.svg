<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-vat-return — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · zero writes</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Automatic scoping</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Filing frequency read from DGFIP payments</tspan><tspan x="50" y="180">(monthly or quarterly CA3), simplified</tspan><tspan x="50" y="199">regime out of scope and stated (abolished</tspan><tspan x="50" y="218">2027-01-01), chargeability detected: VAT</tspan><tspan x="50" y="237">on debits or on receipts.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Collected VAT per rate</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Bases and tax at 20 / 10 / 5.5 / 2.1% →</tspan><tspan x="435" y="180">boxes 08, 09, 9B, 11. On receipts:</tspan><tspan x="435" y="199">incoming payments matched to client</tspan><tspan x="435" y="218">invoices; credit notes deducted; unmatched</tspan><tspan x="435" y="237">receipts listed separately.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Deductible VAT (a floor)</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Summed vat_amount on debits + deduped</tspan><tspan x="820" y="180">supplier invoices; fixed assets (box 19)</tspan><tspan x="820" y="199">split out when detectable; total announced</tspan><tspan x="820" y="218">as a floor with the count of untagged</tspan><tspan x="820" y="237">debits.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Reverse charge flagged</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Foreign counterparties (EU purchases,</tspan><tspan x="820" y="436">imports) detected → candidate transactions</tspan><tspan x="820" y="455">and the boxes involved (03, 17, A4/I)</tspan><tspan x="820" y="474">flagged &#x27;verify with your accountant&#x27;,</tspan><tspan x="820" y="493">never computed silently.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Net position + checks</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Line 28 payable or credit to carry forward</tspan><tspan x="435" y="436">(25/27), in cents + whole-euro rounding.</tspan><tspan x="435" y="455">Checks: vs past DGFIP payments, vs</tspan><tspan x="435" y="474">previous months, vs statements — every gap</tspan><tspan x="435" y="493">flagged ⚠️.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Copy-ready table</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Form box → label → amount → justification,</tspan><tspan x="50" y="436">ready for the tax portal. A preparation</tspan><tspan x="50" y="455">aid, NOT a filing: nothing is transmitted,</tspan><tspan x="50" y="474">accountant validation recommended.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>