<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-vat-return — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 0 écriture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Cadrage automatique</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Périodicité lue dans les paiements DGFIP</tspan><tspan x="50" y="180">(CA3 mensuelle ou trimestrielle), réel</tspan><tspan x="50" y="199">simplifié hors scope annoncé (supprimé au</tspan><tspan x="50" y="218">01/01/2027), fait générateur détecté : TVA</tspan><tspan x="50" y="237">sur les débits ou sur les encaissements.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">TVA collectée par taux</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Bases et taxes 20 / 10 / 5,5 / 2,1 % →</tspan><tspan x="435" y="180">cases 08, 09, 9B, 11. Sur encaissements :</tspan><tspan x="435" y="199">paiements reçus matchés aux factures</tspan><tspan x="435" y="218">clients ; avoirs déduits ; encaissements</tspan><tspan x="435" y="237">sans facture listés à part.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">TVA déductible (plancher)</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Somme des vat_amount des débits + factures</tspan><tspan x="820" y="180">fournisseurs dédupliquées ;</tspan><tspan x="820" y="199">immobilisations (case 19) séparées si</tspan><tspan x="820" y="218">détectables ; total annoncé comme plancher</tspan><tspan x="820" y="237">avec le compte des débits non renseignés.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Autoliquidation signalée</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Contreparties étrangères (achats UE,</tspan><tspan x="820" y="436">imports) détectées → transactions</tspan><tspan x="820" y="455">candidates et cases concernées (03, 17,</tspan><tspan x="820" y="474">A4/I) signalées « à vérifier avec</tspan><tspan x="820" y="493">l&#x27;expert-comptable », jamais calculées en</tspan><tspan x="820" y="512">silence.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Position nette + contrôles</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Ligne 28 à payer ou crédit à reporter</tspan><tspan x="435" y="436">(25/27), au centime + arrondi à l&#x27;euro.</tspan><tspan x="435" y="455">Contrôles : vs paiements DGFIP passés, vs</tspan><tspan x="435" y="474">mois précédents, vs relevés — chaque écart</tspan><tspan x="435" y="493">signalé ⚠️.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Tableau prêt à recopier</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Case du formulaire → libellé → montant →</tspan><tspan x="50" y="436">justification, prêt pour impots.gouv.fr.</tspan><tspan x="50" y="455">Aide à la préparation, PAS une déclaration</tspan><tspan x="50" y="474">: rien n&#x27;est télétransmis, validation</tspan><tspan x="50" y="493">expert-comptable recommandée.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>