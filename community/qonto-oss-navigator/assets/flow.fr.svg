<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-oss-navigator — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 1 écriture optionnelle</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Identité &amp; sources</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord : pays</tspan><tspan x="50" y="180">d&#x27;établissement, comptes, sous-compte</tspan><tspan x="50" y="199">impôts. Détection du MCP Shopify → le mode</tspan><tspan x="50" y="218">est annoncé : pays réels par commande, ou</tspan><tspan x="50" y="237">inférence Qonto partielle.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Ventes par pays de livraison</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Shopify : commandes B2C par pays</tspan><tspan x="435" y="180">d&#x27;expédition, nettes de remboursements.</tspan><tspan x="435" y="199">Sinon : factures clients + indices devises</tspan><tspan x="435" y="218">des encaissements. Domestique et hors UE</tspan><tspan x="435" y="237">exclus du calcul.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Jauge du seuil 10 000 €</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Cumul B2C transfrontalier UE de l&#x27;année</tspan><tspan x="820" y="180">civile (et contrôle de l&#x27;année passée) : «</tspan><tspan x="820" y="199">tu es à X € sur 10 000 € », franchissement</tspan><tspan x="820" y="218">daté ou estimé. Le B2B intracom est isolé,</tspan><tspan x="820" y="237">hors jauge.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Taux du pays du client</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Table statique des taux des 27 États</tspan><tspan x="820" y="436">membres, millésimée (2026-07), affichée</tspan><tspan x="820" y="455">avec son millésime — à vérifier avant</tspan><tspan x="820" y="474">dépôt. Taux normal par défaut ; taux</tspan><tspan x="820" y="493">réduits demandés, jamais devinés.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Brouillon OSS trimestriel</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Pays par pays : base HT, taux, TVA due,</tspan><tspan x="435" y="436">total — devises non-euro au taux BCE du</tspan><tspan x="435" y="455">dernier jour du trimestre, date limite</tspan><tspan x="435" y="474">(fin du mois suivant) et portail de dépôt</tspan><tspan x="435" y="493">national.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Provision &amp; SCA</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Avec consentement explicite : demande de</tspan><tspan x="50" y="436">virement du total OSS vers le sous-compte</tspan><tspan x="50" y="455">impôts, détail pays par pays dans la note.</tspan><tspan x="50" y="474">L&#x27;argent ne bouge qu&#x27;à l&#x27;approbation SCA</tspan><tspan x="50" y="493">dans l&#x27;app Qonto.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>