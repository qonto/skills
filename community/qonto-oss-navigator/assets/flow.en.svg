<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-oss-navigator — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · one optional write</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Identity &amp; sources</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first: country of</tspan><tspan x="50" y="180">establishment, accounts, tax sub-account.</tspan><tspan x="50" y="199">Shopify MCP probe → the mode is stated:</tspan><tspan x="50" y="218">real countries per order, or partial</tspan><tspan x="50" y="237">Qonto-only inference.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Sales by shipping country</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Shopify: B2C orders by shipping country,</tspan><tspan x="435" y="180">net of refunds. Otherwise: client invoices</tspan><tspan x="435" y="199">+ currency hints on incoming payments.</tspan><tspan x="435" y="218">Domestic sales and non-EU exports</tspan><tspan x="435" y="237">excluded.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">The €10,000 gauge</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Cumulated cross-border B2C EU sales this</tspan><tspan x="820" y="180">calendar year (plus the previous-year</tspan><tspan x="820" y="199">check): &#x27;you&#x27;re at X € of 10,000 €&#x27;,</tspan><tspan x="820" y="218">crossing dated or estimated. Intra-EU B2B</tspan><tspan x="820" y="237">isolated, out of the gauge.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Customer-country rates</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Static rate table for all 27 member</tspan><tspan x="820" y="436">states, vintage-dated (2026-07), shown</tspan><tspan x="820" y="455">with its vintage — verify before filing.</tspan><tspan x="820" y="474">Standard rate by default; reduced rates</tspan><tspan x="820" y="493">asked, never guessed.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Quarterly OSS draft</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Country by country: net base, rate, VAT</tspan><tspan x="435" y="436">due, total — non-euro currencies at the</tspan><tspan x="435" y="455">ECB last-day-of-quarter rate, deadline</tspan><tspan x="435" y="474">(end of the following month) and national</tspan><tspan x="435" y="493">filing portal.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Provision &amp; SCA</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">With explicit consent: a transfer request</tspan><tspan x="50" y="436">for the OSS total to the tax sub-account,</tspan><tspan x="50" y="455">country breakdown in the note. Money moves</tspan><tspan x="50" y="474">only at SCA approval in the Qonto app.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>