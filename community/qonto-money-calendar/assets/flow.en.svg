<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-money-calendar — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · calendar ↔ Qonto</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Account snapshot</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first: organization,</tspan><tspan x="50" y="180">accounts, invoicing settings. Google</tspan><tspan x="50" y="199">Calendar MCP detection — present: full</tspan><tspan x="50" y="218">mode; absent: schedule as a table,</tspan><tspan x="50" y="237">direction 2 unavailable.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Collect the deadlines</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Supplier invoices to pay, client invoices</tspan><tspan x="435" y="180">to collect, recurrences over 24-36 months</tspan><tspan x="435" y="199">(rent, subscriptions, tax direct debits) —</tspan><tspan x="435" y="218">monthly, quarterly and yearly cadences</tspan><tspan x="435" y="237">projected.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Direction 1 — push</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Recap shown in the conversation (date,</tspan><tspan x="820" y="180">title, amount, source). On explicit</tspan><tspan x="820" y="199">confirmation: events created with the</tspan><tspan x="820" y="218">amount in the title, a D-3 reminder and an</tspan><tspan x="820" y="237">anti-duplicate marker.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Direction 2 — read</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Billable days tagged [Client] in event</tspan><tspan x="820" y="436">titles: one event day = 1 day, half-days</tspan><tspan x="820" y="455">via 0.5, counted per client with the list</tspan><tspan x="820" y="474">of dates so mistakes are easy to spot.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Confirmed day rate</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Never guessed: proposed from the invoicing</tspan><tspan x="435" y="436">history (the client&#x27;s past invoices,</tspan><tspan x="435" y="455">day-type catalog products), source shown,</tspan><tspan x="435" y="474">then explicitly confirmed by the user.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">End-of-month invoice</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">create_client_invoice as a DRAFT: days ×</tspan><tspan x="50" y="436">confirmed rate, VAT from the catalog or</tspan><tspan x="50" y="455">settings — never guessed. The user reviews</tspan><tspan x="50" y="474">in Qonto and sends when they decide.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>