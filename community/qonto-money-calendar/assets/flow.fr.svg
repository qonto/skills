<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-money-calendar — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · agenda ↔ Qonto</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Photographie du compte</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord : organisation,</tspan><tspan x="50" y="180">comptes, réglages de facturation.</tspan><tspan x="50" y="199">Détection du MCP Google Calendar — présent</tspan><tspan x="50" y="218">: mode complet ; absent : échéancier en</tspan><tspan x="50" y="237">tableau, sens 2 indisponible.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Collecte des échéances</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Factures fournisseurs à payer, factures</tspan><tspan x="435" y="180">clients à encaisser, récurrences sur 24-36</tspan><tspan x="435" y="199">mois (loyer, abonnements, prélèvements</tspan><tspan x="435" y="218">fiscaux) — cadences mensuelles,</tspan><tspan x="435" y="237">trimestrielles et annuelles projetées.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Sens 1 — pousser</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Récapitulatif affiché dans la conversation</tspan><tspan x="820" y="180">(date, titre, montant, source). Après</tspan><tspan x="820" y="199">confirmation explicite : événements créés,</tspan><tspan x="820" y="218">montant dans le titre, rappel J-3,</tspan><tspan x="820" y="237">marqueur anti-doublons.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Sens 2 — lire</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Lecture des jours facturables tagués</tspan><tspan x="820" y="436">[Client] dans les titres d&#x27;événements : 1</tspan><tspan x="820" y="455">événement-jour = 1 jour, demi-journées via</tspan><tspan x="820" y="474">0.5, comptage par client avec la liste des</tspan><tspan x="820" y="493">dates.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">TJM confirmé</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Jamais deviné : proposé depuis</tspan><tspan x="435" y="436">l&#x27;historique de facturation (factures</tspan><tspan x="435" y="455">passées du client, catalogue produits type</tspan><tspan x="435" y="474">« jour »), source affichée, puis confirmé</tspan><tspan x="435" y="493">explicitement par l&#x27;utilisateur.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Facture de fin de mois</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">create_client_invoice en BROUILLON : jours</tspan><tspan x="50" y="436">× TJM confirmé, TVA du catalogue ou des</tspan><tspan x="50" y="455">réglages — jamais devinée. L&#x27;utilisateur</tspan><tspan x="50" y="474">relit dans Qonto et envoie quand il</tspan><tspan x="50" y="493">décide.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>