<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-tax-radar — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · zéro écriture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Photographie de l&#x27;organisation</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord : pays, forme</tspan><tspan x="50" y="180">juridique, comptes et soldes. France → les</tspan><tspan x="50" y="199">8 axes complets ; autre pays Qonto → axes</tspan><tspan x="50" y="218">universels seulement (justificatifs,</tspan><tspan x="50" y="237">doublons, espèces), annoncé clairement.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Collecte de l&#x27;historique</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">12 mois de transactions paginées ≤ 50 par</tspan><tspan x="435" y="180">fenêtres trimestrielles, puis factures</tspan><tspan x="435" y="199">fournisseurs, labels et justificatifs</tspan><tspan x="435" y="218">attachés : chaque dépense est croisée avec</tspan><tspan x="435" y="237">sa pièce et sa catégorie.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Crible des 8 axes DGFIP</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Charges somptuaires, dépenses perso,</tspan><tspan x="820" y="180">compte courant d&#x27;associé, TVA déduite vs</tspan><tspan x="820" y="199">justificatifs, avantages en nature,</tspan><tspan x="820" y="218">doublons de charges, espèces, montants</tspan><tspan x="820" y="237">ronds récurrents — la vraie grille de</tspan><tspan x="820" y="256">vérification.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Chiffrage du risque</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Pour chaque point d&#x27;attention : TVA</tspan><tspan x="820" y="436">rappelable, réintégration IS, intérêts de</tspan><tspan x="820" y="455">retard et pénalités en ordres de grandeur</tspan><tspan x="820" y="474">pédagogiques — par axe et en cumul, jamais</tspan><tspan x="820" y="493">présenté comme un calcul officiel.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Rapport de risque 🟢🟡🔴</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Un niveau par axe, note globale = pire</tspan><tspan x="435" y="436">axe, et chaque signalement = transaction</tspan><tspan x="435" y="455">précise + règle fiscale citée + action</tspan><tspan x="435" y="474">corrective. Des « points d&#x27;attention »,</tspan><tspan x="435" y="493">jamais des accusations.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Plan de régularisation</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">La liste priorisée des corrections à faire</tspan><tspan x="50" y="436">AVANT un contrôle : justificatifs à</tspan><tspan x="50" y="455">récupérer, dépenses à rembourser ou</tspan><tspan x="50" y="474">requalifier, pièces à produire — à valider</tspan><tspan x="50" y="493">avec l&#x27;expert-comptable, puis re-run.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>