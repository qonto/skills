<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-tax-radar — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · zero writes</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Map the organization</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first: country, legal</tspan><tspan x="50" y="180">form, accounts and balances. France → all</tspan><tspan x="50" y="199">8 axes; other Qonto countries → universal</tspan><tspan x="50" y="218">axes only (receipts, duplicates, cash),</tspan><tspan x="50" y="237">stated plainly, nothing invented.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Collect the history</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">12 months of transactions paginated ≤ 50</tspan><tspan x="435" y="180">in quarterly windows, then supplier</tspan><tspan x="435" y="199">invoices, labels and attached receipts:</tspan><tspan x="435" y="218">every expense is cross-checked against its</tspan><tspan x="435" y="237">supporting document and category.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Screen the 8 audit axes</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Lavish expenses, personal spending,</tspan><tspan x="820" y="180">director&#x27;s current account, VAT deducted</tspan><tspan x="820" y="199">vs receipts, benefits in kind, duplicate</tspan><tspan x="820" y="218">charges, cash, recurring round amounts —</tspan><tspan x="820" y="237">the checklist real auditors use.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Price the exposure</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">For every point of attention: reclaimable</tspan><tspan x="820" y="436">VAT, corporate-tax reintegration, late</tspan><tspan x="820" y="455">interest and penalties as educational</tspan><tspan x="820" y="474">orders of magnitude — per axis and in</tspan><tspan x="820" y="493">total, never an official computation.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Risk report 🟢🟡🔴</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">One level per axis, global grade = worst</tspan><tspan x="435" y="436">axis, and every finding = a precise</tspan><tspan x="435" y="455">transaction + the tax rule cited + a</tspan><tspan x="435" y="474">corrective action. &#x27;Points of attention&#x27;,</tspan><tspan x="435" y="493">never accusations — it de-dramatizes.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Remediation plan</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">A ranked list of fixes to make BEFORE any</tspan><tspan x="50" y="436">audit: receipts to recover, expenses to</tspan><tspan x="50" y="455">reimburse or reclassify, documents to</tspan><tspan x="50" y="474">produce — validated with the accountant,</tspan><tspan x="50" y="493">then re-run and compare grades.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>