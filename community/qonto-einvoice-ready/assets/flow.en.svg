<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-einvoice-ready — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · single write (client records)</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Company snapshot</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first: country and</tspan><tspan x="50" y="180">identity. Company size (large, mid-cap,</tspan><tspan x="50" y="199">SME) fetched from the public registry or</tspan><tspan x="50" y="218">asked → applicable timeline: receiving</tspan><tspan x="50" y="237">09/2026 for all, issuing 2026 or 2027.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Client-file audit</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Every B2B record scored on the identifiers</tspan><tspan x="435" y="180">Factur-X requires: SIREN/SIRET, intra-EU</tspan><tspan x="435" y="199">VAT number, structured address. Gaps</tspan><tspan x="435" y="218">listed record by record, individuals</tspan><tspan x="435" y="237">flagged as B2C.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Invoice quality</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Invoices from the last 12 months: what</tspan><tspan x="820" y="180">share is attached to a complete client</tspan><tspan x="820" y="199">record and would pass as Factur-X today?</tspan><tspan x="820" y="218">Blockers are named precisely.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">E-reporting exposure</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Foreign and consumer (B2C) clients spotted</tspan><tspan x="820" y="436">in the records and the real money flows →</tspan><tspan x="820" y="455">transactions outside e-invoicing but</tspan><tspan x="820" y="474">subject to data transmission</tspan><tspan x="820" y="493">(e-reporting).</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Live fix</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">SIRENs recovered via the public company</tspan><tspan x="435" y="436">registry API (no key), intra-EU VAT</tspan><tspan x="435" y="455">derived from the SIREN. Line-by-line</tspan><tspan x="435" y="474">preview → confirmation → update_client</tspan><tspan x="435" y="493">field by field, never in bulk.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Score &amp; action plan</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Readiness before/after, countdown to</tspan><tspan x="50" y="436">2026-09-01, remaining items — including</tspan><tspan x="50" y="455">the choice of an accredited platform</tspan><tspan x="50" y="474">(PDP), which belongs to the user.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>