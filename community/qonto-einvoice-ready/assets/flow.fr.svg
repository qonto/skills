<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-einvoice-ready — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 1 seule écriture (fiches clients)</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Photo de l&#x27;entreprise</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization en premier : pays et</tspan><tspan x="50" y="180">identité. Taille (GE, ETI, PME) retrouvée</tspan><tspan x="50" y="199">au registre public ou demandée →</tspan><tspan x="50" y="218">calendrier applicable : réception 09/2026</tspan><tspan x="50" y="237">pour tous, émission 2026 ou 2027.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Audit du fichier clients</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Chaque fiche B2B notée sur les</tspan><tspan x="435" y="180">identifiants que Factur-X exige :</tspan><tspan x="435" y="199">SIREN/SIRET, n° de TVA intracom, adresse</tspan><tspan x="435" y="218">structurée. Les manques sont listés fiche</tspan><tspan x="435" y="237">par fiche, les particuliers fléchés B2C.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Qualité des factures</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Les factures des 12 derniers mois : quelle</tspan><tspan x="820" y="180">part est rattachée à une fiche complète et</tspan><tspan x="820" y="199">passerait en Factur-X aujourd&#x27;hui ? Ce qui</tspan><tspan x="820" y="218">bloquerait est nommé précisément.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Exposition e-reporting</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Clients étrangers et particuliers (B2C)</tspan><tspan x="820" y="436">repérés dans les fiches et dans les flux</tspan><tspan x="820" y="455">réels → transactions hors e-invoicing mais</tspan><tspan x="820" y="474">soumises à la transmission de données</tspan><tspan x="820" y="493">(e-reporting).</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Correction en live</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">SIREN retrouvés via l&#x27;API publique</tspan><tspan x="435" y="436">recherche-entreprises (sans clé), TVA</tspan><tspan x="435" y="455">intracom dérivée du SIREN. Aperçu ligne</tspan><tspan x="435" y="474">par ligne → confirmation → update_client</tspan><tspan x="435" y="493">champ par champ, jamais en masse.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Score &amp; plan d&#x27;action</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Readiness avant/après, compte à rebours</tspan><tspan x="50" y="436">vers le 01/09/2026, points restants — dont</tspan><tspan x="50" y="455">le choix de la plateforme agréée (PDP),</tspan><tspan x="50" y="474">qui appartient à l&#x27;utilisateur.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>