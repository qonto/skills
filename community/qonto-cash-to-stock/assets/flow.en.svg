<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-cash-to-stock — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · single write</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Cash snapshot</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first: every account,</tspan><tspan x="50" y="180">balance, currency, country. The starting</tspan><tspan x="50" y="199">ceiling is real cash — never a hardcoded</tspan><tspan x="50" y="218">value.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Committed outflows</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Supplier invoices coming due, tax</tspan><tspan x="435" y="180">deadlines detected in history (outgoing</tspan><tspan x="435" y="199">direct debits) and recurring fixed costs →</tspan><tspan x="435" y="218">a dated 90-day calendar of outgoing money.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Truly free cash</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Day-by-day curve: balances + conservative</tspan><tspan x="820" y="180">receipts − commitments − safety buffer</tspan><tspan x="820" y="199">(one month of fixed costs by default). The</tspan><tspan x="820" y="218">dated minimum is what a restock may</tspan><tspan x="820" y="237">consume.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Velocity &amp; stock-out</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Shopify when connected: units/day and</tspan><tspan x="820" y="436">on-hand stock per product → stock-out</tspan><tspan x="820" y="455">date. Otherwise: estimate from Qonto</tspan><tspan x="820" y="474">receipts + the list_products catalog,</tspan><tspan x="820" y="493">clearly labeled 🟡.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Order window</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">The answer: N fundable units (free cash ÷</tspan><tspan x="435" y="436">unit cost) and the latest order date</tspan><tspan x="435" y="455">(stock-out − supplier lead time). Every</tspan><tspan x="435" y="474">figure carries a confidence tag 🟢🟡🔵.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Request + SCA</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">With explicit consent: a supplier transfer</tspan><tspan x="50" y="436">request, full calculation in the note.</tspan><tspan x="50" y="455">Money moves only after the user&#x27;s own 2FA</tspan><tspan x="50" y="474">approval in the Qonto app.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>