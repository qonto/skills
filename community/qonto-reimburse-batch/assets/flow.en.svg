<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-reimburse-batch — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · single write</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Collect the claims</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">From Slack (expenses channel) or Notion</tspan><tspan x="50" y="180">when the MCP is connected — otherwise</tspan><tspan x="50" y="199">pasted in the conversation. Normalized:</tspan><tspan x="50" y="218">employee, amount, date, category, reason,</tspan><tspan x="50" y="237">IBAN, receipt.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Check the receipts</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Every claim must carry a consistent</tspan><tspan x="435" y="180">receipt: amount and date matching the</tspan><tspan x="435" y="199">claim. Missing or mismatched → put on hold</tspan><tspan x="435" y="218">with the exact reason, never into the</tspan><tspan x="435" y="237">batch.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Hunt duplicates</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">list_transactions scans card spend around</tspan><tspan x="820" y="180">the claim date (emitted_at ±5 days): same</tspan><tspan x="820" y="199">amount, similar counterparty → documented</tspan><tspan x="820" y="218">duplicate presumption, transaction cited.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Apply the expense policy</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Per-category caps defined by the user</tspan><tspan x="820" y="436">(meals, taxi, equipment…). Over cap →</tspan><tspan x="820" y="455">flagged with the gap; the user decides:</tspan><tspan x="820" y="474">cap it, accept it or reject it.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">One grouped request</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">With explicit consent: ONE</tspan><tspan x="435" y="436">create_multi_transfer_request for the N</tspan><tspan x="435" y="455">validated claims — one transfer per</tspan><tspan x="435" y="474">employee, IBANs as provided (never</tspan><tspan x="435" y="493">invented), reason in the reference.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">SCA approval</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Qonto push → the owner approves all N</tspan><tspan x="50" y="436">transfers in one gesture with their own</tspan><tspan x="50" y="455">2FA in the app. Money moves ONLY here.</tspan><tspan x="50" y="474">Final report: who gets reimbursed, how</tspan><tspan x="50" y="493">much.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>