<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-reimburse-batch — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 1 seule écriture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Collecte des demandes</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Depuis Slack (#notes-de-frais) ou Notion</tspan><tspan x="50" y="180">si le MCP est présent — sinon collées dans</tspan><tspan x="50" y="199">la conversation. Normalisées : salarié,</tspan><tspan x="50" y="218">montant, date, catégorie, motif, IBAN,</tspan><tspan x="50" y="237">justificatif.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Contrôle des justificatifs</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Chaque demande doit porter un justificatif</tspan><tspan x="435" y="180">cohérent : montant et date alignés avec la</tspan><tspan x="435" y="199">demande. Manquant ou incohérent → mise en</tspan><tspan x="435" y="218">attente motivée, jamais dans le lot.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Chasse aux doublons</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">list_transactions scanne les dépenses</tspan><tspan x="820" y="180">carte autour de la date (emitted_at ±5 j)</tspan><tspan x="820" y="199">: même montant, tiers proche → présomption</tspan><tspan x="820" y="218">de doublon documentée, transaction citée.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Politique de frais</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Plafonds par catégorie définis par</tspan><tspan x="820" y="436">l&#x27;utilisateur (repas, taxi, matériel…).</tspan><tspan x="820" y="455">Dépassement → signalé avec l&#x27;écart ;</tspan><tspan x="820" y="474">l&#x27;utilisateur tranche : plafonner,</tspan><tspan x="820" y="493">accepter ou rejeter.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Demande groupée</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Avec le consentement explicite : UNE</tspan><tspan x="435" y="436">create_multi_transfer_request pour les N</tspan><tspan x="435" y="455">demandes validées — un virement par</tspan><tspan x="435" y="474">salarié, IBAN fournis (jamais inventés),</tspan><tspan x="435" y="493">motif en référence.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Approbation SCA</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Push Qonto → le dirigeant approuve les N</tspan><tspan x="50" y="436">virements d&#x27;un seul geste avec sa 2FA dans</tspan><tspan x="50" y="455">l&#x27;app. L&#x27;argent bouge SEULEMENT ici.</tspan><tspan x="50" y="474">Rapport final : qui est remboursé,</tspan><tspan x="50" y="493">combien.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>