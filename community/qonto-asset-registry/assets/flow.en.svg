<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-asset-registry — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · zero writes</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Scan the purchases</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Up to 36 months of transactions per</tspan><tspan x="50" y="180">account (debits, pagination ≤ 50) plus</tspan><tspan x="50" y="199">supplier invoices matched by amount and</tspan><tspan x="50" y="218">date: suppliers, labels, pre-tax and total</tspan><tspan x="50" y="237">amounts.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Recognize the equipment</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Claude&#x27;s general knowledge spots IT,</tspan><tspan x="435" y="180">furniture, machines, vehicles, tools and</tspan><tspan x="435" y="199">phones from the first occurrence.</tspan><tspan x="435" y="218">Ambiguous generalist merchant → marked &quot;to</tspan><tspan x="435" y="237">confirm&quot;.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Apply the €500 threshold</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">French pre-tax practice: below = expense,</tspan><tspan x="820" y="180">above = fixed asset (threshold</tspan><tspan x="820" y="199">configurable). Leasing flagged &quot;financed,</tspan><tspan x="820" y="218">not capitalized here&quot;, never counted.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Link the receipts</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Every asset is tied to its transaction</tspan><tspan x="820" y="436">attachment; a completeness gauge is</tspan><tspan x="820" y="455">computed. Missing receipt → line flagged 📎</tspan><tspan x="820" y="474">with a pointer to qonto-receipt-hunter.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Indicative depreciation</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Usual lives (IT 3 years, furniture 10,</tspan><tspan x="435" y="436">vehicles 4-5, machines 5-10),</tspan><tspan x="435" y="455">straight-line, estimated net book value —</tspan><tspan x="435" y="474">customs, for the accountant to validate.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Register &amp; insurance inventory</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Register sorted by category and value,</tspan><tspan x="50" y="436">receipt gauge, insured total, HTML</tspan><tspan x="50" y="455">dashboard — and the insurance inventory</tspan><tspan x="50" y="474">ready to send, before the theft or the</tspan><tspan x="50" y="493">claim.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>