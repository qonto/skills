<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-asset-registry &#x2014; Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 &#xE9;tapes &#xB7; 0 &#xE9;criture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Scan des achats</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Jusqu'&#xE0; 36 mois de transactions par compte</tspan><tspan x="50" y="180">(d&#xE9;bits, pagination &#x2264; 50) + factures</tspan><tspan x="50" y="199">fournisseurs rapproch&#xE9;es par montant et</tspan><tspan x="50" y="218">date : fournisseurs, libell&#xE9;s, montants</tspan><tspan x="50" y="237">HT/TTC.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Reconnaissance des &#xE9;quipements</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">La culture g&#xE9;n&#xE9;rale de Claude reconna&#xEE;t</tspan><tspan x="435" y="180">informatique, mobilier, machines,</tspan><tspan x="435" y="199">v&#xE9;hicules, outillage, t&#xE9;l&#xE9;phonie d&#xE8;s la</tspan><tspan x="435" y="218">premi&#xE8;re occurrence. Marchand g&#xE9;n&#xE9;raliste</tspan><tspan x="435" y="237">ambigu &#x2192; &#xAB; &#xE0; confirmer &#xBB;.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Seuil des 500 &#x20AC; HT</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Tol&#xE9;rance fiscale fran&#xE7;aise : en dessous =</tspan><tspan x="820" y="180">charge, au-dessus = immobilisation (seuil</tspan><tspan x="820" y="199">configurable). Leasing/LOA signal&#xE9; &#xAB;</tspan><tspan x="820" y="218">financ&#xE9;, pas immobilis&#xE9; ici &#xBB;, jamais</tspan><tspan x="820" y="237">compt&#xE9;.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Justificatifs li&#xE9;s</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Chaque &#xE9;quipement est reli&#xE9; &#xE0; la pi&#xE8;ce</tspan><tspan x="820" y="436">jointe de sa transaction ; jauge de</tspan><tspan x="820" y="455">compl&#xE9;tude calcul&#xE9;e. Justificatif absent &#x2192;</tspan><tspan x="820" y="474">ligne &#x1F4CE; avec renvoi vers</tspan><tspan x="820" y="493">&#xE0; r&#xE9;cup&#xE9;rer avant de se fier &#xE0; l'inventaire.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Amortissements indicatifs</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Dur&#xE9;es usuelles (informatique 3 ans,</tspan><tspan x="435" y="436">mobilier 10, v&#xE9;hicules 4-5, machines</tspan><tspan x="435" y="455">5-10), lin&#xE9;aire, valeur nette comptable</tspan><tspan x="435" y="474">estim&#xE9;e &#x2014; des usages, &#xE0; valider par</tspan><tspan x="435" y="493">l'expert-comptable.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Registre &amp; inventaire assurance</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Registre tri&#xE9; par cat&#xE9;gorie et valeur,</tspan><tspan x="50" y="436">jauge de justificatifs, total assur&#xE9;,</tspan><tspan x="50" y="455">rapport markdown &#x2014; et l'inventaire assurance</tspan><tspan x="50" y="474">pr&#xEA;t &#xE0; transmettre, avant le vol ou le</tspan><tspan x="50" y="493">sinistre.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>
