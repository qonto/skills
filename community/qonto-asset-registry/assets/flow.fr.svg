<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-asset-registry — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 0 écriture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Scan des achats</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Jusqu&#x27;à 36 mois de transactions par compte</tspan><tspan x="50" y="180">(débits, pagination ≤ 50) + factures</tspan><tspan x="50" y="199">fournisseurs rapprochées par montant et</tspan><tspan x="50" y="218">date : fournisseurs, libellés, montants</tspan><tspan x="50" y="237">HT/TTC.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Reconnaissance des équipements</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">La culture générale de Claude reconnaît</tspan><tspan x="435" y="180">informatique, mobilier, machines,</tspan><tspan x="435" y="199">véhicules, outillage, téléphonie dès la</tspan><tspan x="435" y="218">première occurrence. Marchand généraliste</tspan><tspan x="435" y="237">ambigu → « à confirmer ».</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Seuil des 500 € HT</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Tolérance fiscale française : en dessous =</tspan><tspan x="820" y="180">charge, au-dessus = immobilisation (seuil</tspan><tspan x="820" y="199">configurable). Leasing/LOA signalé «</tspan><tspan x="820" y="218">financé, pas immobilisé ici », jamais</tspan><tspan x="820" y="237">compté.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Justificatifs liés</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Chaque équipement est relié à la pièce</tspan><tspan x="820" y="436">jointe de sa transaction ; jauge de</tspan><tspan x="820" y="455">complétude calculée. Justificatif absent →</tspan><tspan x="820" y="474">ligne 📎 avec renvoi vers</tspan><tspan x="820" y="493">qonto-receipt-hunter.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Amortissements indicatifs</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Durées usuelles (informatique 3 ans,</tspan><tspan x="435" y="436">mobilier 10, véhicules 4-5, machines</tspan><tspan x="435" y="455">5-10), linéaire, valeur nette comptable</tspan><tspan x="435" y="474">estimée — des usages, à valider par</tspan><tspan x="435" y="493">l&#x27;expert-comptable.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Registre &amp; inventaire assurance</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Registre trié par catégorie et valeur,</tspan><tspan x="50" y="436">jauge de justificatifs, total assuré,</tspan><tspan x="50" y="455">dashboard HTML — et l&#x27;inventaire assurance</tspan><tspan x="50" y="474">prêt à transmettre, avant le vol ou le</tspan><tspan x="50" y="493">sinistre.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>