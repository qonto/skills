<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-board-pack — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · zéro écriture Qonto</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Cadrage &amp; audience</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord : comptes,</tspan><tspan x="50" y="180">soldes, mois cible. L&#x27;utilisateur choisit</tspan><tspan x="50" y="199">l&#x27;audience — banquier, investisseur ou</tspan><tspan x="50" y="218">interne — et le niveau de détail :</tspan><tspan x="50" y="237">chiffres exacts ou tendances.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Chiffres du mois</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">list_transactions paginé ≤ 50, virements</tspan><tspan x="435" y="180">internes exclus : encaissements, dépenses</tspan><tspan x="435" y="199">par poste (labels), trésorerie fin de mois</tspan><tspan x="435" y="218">(relevé officiel), burn net et runway</tspan><tspan x="435" y="237">calculés.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Comparaisons M-1 &amp; annuelle</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Mêmes indicateurs sur le mois précédent et</tspan><tspan x="820" y="180">l&#x27;année glissante : deltas en € et %,</tspan><tspan x="820" y="199">saisonnalité signalée, encours clients en</tspan><tspan x="820" y="218">signal avancé — jamais de tendance sur un</tspan><tspan x="820" y="237">seul mois.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Faits marquants</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Détection dans les données : gros contrat</tspan><tspan x="820" y="436">encaissé, nouvelle dépense significative,</tspan><tspan x="820" y="455">paiement client récurrent manquant, pic</tspan><tspan x="820" y="474">par poste — chaque fait cite ses</tspan><tspan x="820" y="493">transactions.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Narration exécutive</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Trois paragraphes rédigés — highlights,</tspan><tspan x="435" y="436">chiffres, perspectives — ton factuel, ni</tspan><tspan x="435" y="455">vendeur ni alarmiste. Arrêt obligatoire :</tspan><tspan x="435" y="474">l&#x27;utilisateur relit et corrige AVANT la</tspan><tspan x="435" y="493">mise en forme.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Pack &amp; email d&#x27;envoi</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Deck HTML autoportant 5-6 slides (ou Canva</tspan><tspan x="50" y="436">si le MCP est présent) + email rédigé</tspan><tspan x="50" y="455">(brouillon Gmail si présent). Rien n&#x27;est</tspan><tspan x="50" y="474">jamais envoyé : l&#x27;utilisateur relit et</tspan><tspan x="50" y="493">envoie.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>