<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-prescription-guard — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · 100% read-only</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Receivables inventory</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Every unpaid client invoice across the</tspan><tspan x="50" y="180">entire history (paginated ≤ 50):</tspan><tspan x="50" y="199">outstanding amount, issue date, due date,</tspan><tspan x="50" y="218">linked client record.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">B2B / B2C qualification</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">SIREN or VAT number on the client record →</tspan><tspan x="435" y="180">likely a business (5 years). Otherwise the</tspan><tspan x="435" y="199">skill asks — never guesses: the</tspan><tspan x="435" y="218">qualification changes the whole deadline.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Limitation rules</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">French rules built in: 5 years between</tspan><tspan x="820" y="180">businesses (art. L110-4 Commercial Code),</tspan><tspan x="820" y="199">2 years against a consumer (art. L218-2</tspan><tspan x="820" y="218">Consumer Code). Prudent start: issue date.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Interruptive acts</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Partial payment spotted in the</tspan><tspan x="820" y="436">transactions → clock probably reset at its</tspan><tspan x="820" y="455">date (announced as a heuristic). Debt</tspan><tspan x="820" y="474">acknowledgment, legal action:</tspan><tspan x="820" y="493">user-declared.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">The “act before…” schedule</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Legal death date per receivable, time</tspan><tspan x="435" y="436">left, sorted by urgency × amount: 🔴 &lt; 6</tspan><tspan x="435" y="455">months · 🟠 &lt; 12 months · 🟡 &lt; 2 years · ⚫</tspan><tspan x="435" y="474">probably time-barred.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Report &amp; next move</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Full table + totals at risk. Friendly</tspan><tspan x="50" y="436">chasing → qonto-invoice-chaser; deadline</tspan><tspan x="50" y="455">closing in → bailiff or lawyer. This is</tspan><tspan x="50" y="474">not legal advice.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>