<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-prescription-guard — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 100 % lecture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Inventaire des créances</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Toutes les factures clients impayées, sur</tspan><tspan x="50" y="180">tout l&#x27;historique (paginé ≤ 50) : montant</tspan><tspan x="50" y="199">restant dû, date d&#x27;émission, date</tspan><tspan x="50" y="218">d&#x27;échéance, fiche client associée.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Qualification B2B / B2C</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">SIREN ou n° de TVA sur la fiche client →</tspan><tspan x="435" y="180">commerçant probable (5 ans). Sinon le</tspan><tspan x="435" y="199">skill demande — jamais de certitude : la</tspan><tspan x="435" y="218">qualification change toute l&#x27;échéance.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Règles de prescription</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Règles françaises embarquées : 5 ans entre</tspan><tspan x="820" y="180">commerçants (art. L110-4 C. com.), 2 ans</tspan><tspan x="820" y="199">contre un consommateur (art. L218-2 C.</tspan><tspan x="820" y="218">conso). Départ prudent : date d&#x27;émission.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Actes interruptifs</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Paiement partiel repéré dans les</tspan><tspan x="820" y="436">transactions → délai probablement</tspan><tspan x="820" y="455">réinitialisé à sa date (heuristique</tspan><tspan x="820" y="474">annoncée). Reconnaissance de dette, action</tspan><tspan x="820" y="493">en justice : déclarées.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Échéancier « agir avant le… »</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Date de mort légale par créance, temps</tspan><tspan x="435" y="436">restant, tri urgence × montant : 🔴 &lt; 6</tspan><tspan x="435" y="455">mois · 🟠 &lt; 12 mois · 🟡 &lt; 2 ans · ⚫</tspan><tspan x="435" y="474">probablement prescrite.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Rapport &amp; passage à l&#x27;action</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Tableau complet + totaux à risque. Relance</tspan><tspan x="50" y="436">amiable → qonto-invoice-chaser ; échéance</tspan><tspan x="50" y="455">proche → commissaire de justice. Ce n&#x27;est</tspan><tspan x="50" y="474">pas un avis juridique.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>