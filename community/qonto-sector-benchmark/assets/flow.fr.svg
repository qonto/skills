<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-sector-benchmark — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 100 % lecture seule</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Identité &amp; secteur</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord : pays, forme</tspan><tspan x="50" y="180">juridique, code NAF. NAF absent → demandé</tspan><tspan x="50" y="199">ou déduit de l&#x27;activité puis confirmé.</tspan><tspan x="50" y="218">Société non française → mode interne</tspan><tspan x="50" y="237">annoncé d&#x27;emblée.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Ratios internes</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">24 mois de transactions et factures : part</tspan><tspan x="435" y="180">des charges fixes, poids des abonnements</tspan><tspan x="435" y="199">logiciels, délai de paiement clients</tspan><tspan x="435" y="218">constaté, saisonnalité du CA, trésorerie</tspan><tspan x="435" y="237">en jours de charges.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Références INSEE</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Via le MCP Datagouv (s&#x27;il est présent) :</tspan><tspan x="820" y="180">recherche des statistiques sectorielles</tspan><tspan x="820" y="199">publiques, millésime et producteur</tspan><tspan x="820" y="218">vérifiés avant usage, données filtrées sur</tspan><tspan x="820" y="237">le code NAF de la boîte.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Comparaison honnête</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Chaque ligne porte source + millésime +</tspan><tspan x="820" y="436">granularité. Classe NAF non publiée →</tspan><tspan x="820" y="455">niveau division, annoncé sur la ligne.</tspan><tspan x="820" y="474">Aucun référentiel → valeur interne seule,</tspan><tspan x="820" y="493">rien d&#x27;inventé.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Auto-benchmark</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Toi vs toi il y a un an : les 5 mêmes</tspan><tspan x="435" y="436">ratios sur la fenêtre 12 mois précédente,</tspan><tspan x="435" y="455">flèches de tendance. C&#x27;est le mode dégradé</tspan><tspan x="435" y="474">complet sans Datagouv ou hors de France.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Bulletin de santé</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Scorecard : ratio, ta valeur, référence</tspan><tspan x="50" y="436">sourcée, verdict, tendance N-1, plus 2-3</tspan><tspan x="50" y="455">constats narratifs et les sources. Rituel</tspan><tspan x="50" y="474">trimestriel — pas du pilotage quotidien.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>