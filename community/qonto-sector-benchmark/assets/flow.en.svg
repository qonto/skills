<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-sector-benchmark — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · 100 % read-only</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Identity &amp; sector</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first: country, legal</tspan><tspan x="50" y="180">form, NAF activity code. Missing NAF →</tspan><tspan x="50" y="199">asked or inferred from the activity, then</tspan><tspan x="50" y="218">confirmed. Non-French company →</tspan><tspan x="50" y="237">internal-only mode, said up front.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Internal ratios</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">24 months of transactions and invoices:</tspan><tspan x="435" y="180">fixed-cost share, software subscription</tspan><tspan x="435" y="199">weight, observed client payment delay,</tspan><tspan x="435" y="218">revenue seasonality, and cash in days of</tspan><tspan x="435" y="237">expenses.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">INSEE references</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Through the Datagouv MCP (when present):</tspan><tspan x="820" y="180">search public sector statistics, vintage</tspan><tspan x="820" y="199">and producer checked before use, data</tspan><tspan x="820" y="218">filtered on the company&#x27;s own NAF activity</tspan><tspan x="820" y="237">code.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Honest comparison</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Every line carries source + vintage +</tspan><tspan x="820" y="436">granularity. NAF class not published →</tspan><tspan x="820" y="455">division level, stated on the line. No</tspan><tspan x="820" y="474">reference at all → internal value only,</tspan><tspan x="820" y="493">nothing invented.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Self-benchmark</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">You vs you a year ago: the same 5 ratios</tspan><tspan x="435" y="436">on the previous 12-month window, with</tspan><tspan x="435" y="455">trend arrows. This is the complete</tspan><tspan x="435" y="474">fallback without Datagouv or outside</tspan><tspan x="435" y="493">France.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Health report</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Scorecard: ratio, your value, sourced</tspan><tspan x="50" y="436">reference, verdict, year-over-year trend,</tspan><tspan x="50" y="455">plus 2-3 narrative findings and the</tspan><tspan x="50" y="474">sources. A quarterly ritual — not daily</tspan><tspan x="50" y="493">piloting.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>