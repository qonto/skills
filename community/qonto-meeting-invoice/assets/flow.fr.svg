<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-meeting-invoice — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · brouillon d&#x27;abord</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Ingestion du transcript</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Le compte-rendu du call arrive tel quel :</tspan><tspan x="50" y="180">fichier texte, note Notion ou Google Drive</tspan><tspan x="50" y="199">(si ce MCP est connecté), ou transcript</tspan><tspan x="50" y="218">collé directement dans la conversation.</tspan><tspan x="50" y="237">Aucun MCP tiers n&#x27;est requis.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Extraction des termes négociés</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Prestations, quantités, prix unitaires,</tspan><tspan x="435" y="180">remises, conditions, échéance — uniquement</tspan><tspan x="435" y="199">ce qui a été dit explicitement, chaque</tspan><tspan x="435" y="218">terme cité. Prix, TVA ou délai absents :</tspan><tspan x="435" y="237">question à l&#x27;utilisateur, jamais</tspan><tspan x="435" y="256">d&#x27;invention.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Rapprochement Qonto</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Chaque prestation est confrontée au</tspan><tspan x="820" y="180">catalogue produits (prix, taux de TVA) et</tspan><tspan x="820" y="199">le prospect aux fiches clients existantes.</tspan><tspan x="820" y="218">Nouveau client : création proposée,</tspan><tspan x="820" y="237">coordonnées relues, confirmation explicite</tspan><tspan x="820" y="256">exigée.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Levée des ambiguïtés</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Tout ce qui reste flou est listé AVANT la</tspan><tspan x="820" y="436">génération : « le tarif habituel »,</tspan><tspan x="820" y="455">condition de paiement non citée, quantité</tspan><tspan x="820" y="474">incertaine. L&#x27;utilisateur tranche chaque</tspan><tspan x="820" y="493">point — le devis n&#x27;existe pas encore.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Devis ou facture en brouillon</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">create_quote (ou create_client_invoice sur</tspan><tspan x="435" y="436">demande) en BROUILLON, sur les paramètres</tspan><tspan x="435" y="455">de facturation Qonto existants :</tspan><tspan x="435" y="474">numérotation, mentions légales. Récap</tspan><tspan x="435" y="493">ligne à ligne affiché pour validation.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Envoi après confirmation</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Seul un « oui, envoie » explicite</tspan><tspan x="50" y="436">déclenche send_quote / send_client_invoice</tspan><tspan x="50" y="455">via Qonto, adresse email confirmée. Sinon</tspan><tspan x="50" y="474">le document reste en brouillon. Le</tspan><tspan x="50" y="493">prospect reçoit le devis pendant que le</tspan><tspan x="50" y="512">café est encore chaud.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>