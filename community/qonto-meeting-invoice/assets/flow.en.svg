<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-meeting-invoice — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · draft first</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Ingest the transcript</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">The call notes come in as they are: a text</tspan><tspan x="50" y="180">file, a Notion or Google Drive note (when</tspan><tspan x="50" y="199">that MCP is connected), or a transcript</tspan><tspan x="50" y="218">pasted straight into the conversation. No</tspan><tspan x="50" y="237">third-party MCP is required.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Extract negotiated terms</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Deliverables, quantities, unit prices,</tspan><tspan x="435" y="180">discounts, terms, deadlines — only what</tspan><tspan x="435" y="199">was explicitly said, every term quoted.</tspan><tspan x="435" y="218">Missing price, VAT or due date: a question</tspan><tspan x="435" y="237">to the user, never an invention.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Match against Qonto</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Every line is checked against the product</tspan><tspan x="820" y="180">catalog (price, VAT rate) and the prospect</tspan><tspan x="820" y="199">against existing client records. New</tspan><tspan x="820" y="218">client: creation proposed, details read</tspan><tspan x="820" y="237">back, explicit confirmation required.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Surface ambiguities</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Everything still fuzzy is listed BEFORE</tspan><tspan x="820" y="436">generation: &#x27;the usual rate&#x27;, an unstated</tspan><tspan x="820" y="455">payment term, an uncertain quantity. The</tspan><tspan x="820" y="474">user settles each point — the quote does</tspan><tspan x="820" y="493">not exist yet.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Draft quote or invoice</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">create_quote (or create_client_invoice on</tspan><tspan x="435" y="436">request) as a DRAFT, on the organization&#x27;s</tspan><tspan x="435" y="455">existing Qonto invoicing settings:</tspan><tspan x="435" y="474">numbering, legal mentions. Full</tspan><tspan x="435" y="493">line-by-line recap shown for validation.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Send after confirmation</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Only an explicit &#x27;yes, send it&#x27; triggers</tspan><tspan x="50" y="436">send_quote / send_client_invoice through</tspan><tspan x="50" y="455">Qonto, email address confirmed. Otherwise</tspan><tspan x="50" y="474">the document stays a draft. The prospect</tspan><tspan x="50" y="493">gets the quote while the coffee is still</tspan><tspan x="50" y="512">warm.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>