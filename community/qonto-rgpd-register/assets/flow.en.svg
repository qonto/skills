<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-rgpd-register — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · zero write</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Controller identity</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization: legal name, form,</tspan><tspan x="50" y="180">address, country → the mandatory register</tspan><tspan x="50" y="199">header. GDPR = the whole EU; CNIL format</tspan><tspan x="50" y="218">in France, local authority elsewhere.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Spending scan</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">12–24 months of debits per account</tspan><tspan x="435" y="180">(pagination ≤ 50) + supplier invoices.</tspan><tspan x="435" y="199">Spellings normalized and merged; last-seen</tspan><tspan x="435" y="218">date tracked for every tool.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Tool classification</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Each recognized SaaS (general knowledge,</tspan><tspan x="820" y="180">from the 1st occurrence): personal data?</tspan><tspan x="820" y="199">Category, typical data, EU/non-EU HQ —</tspan><tspan x="820" y="218">everything tagged &quot;to validate&quot;.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Register cards</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Grouped by purpose, not by vendor:</tspan><tspan x="820" y="436">prospecting, marketing, audience, support,</tspan><tspan x="820" y="455">HR (list_memberships hint). One Article 30</tspan><tspan x="820" y="474">card per activity, CNIL format.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Flags</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">🔴 non-EU → SCCs/adequacy to verify · 🟠 DPA</tspan><tspan x="435" y="436">to locate or sign · 🟡 gone from the debits</tspan><tspan x="435" y="455">≥ 6 months → retire? · 🟡 reseller masking</tspan><tspan x="435" y="474">the vendor → the skill asks.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Register delivered</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Summary + one card per activity +</tspan><tspan x="50" y="436">prioritized to-do in markdown; print-ready</tspan><tspan x="50" y="455">HTML register when the host renders files.</tspan><tspan x="50" y="474">Everywhere: a draft, not legal advice.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>