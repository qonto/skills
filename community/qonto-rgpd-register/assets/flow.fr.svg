<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-rgpd-register — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · zéro écriture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Identité du responsable</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization : raison sociale, forme,</tspan><tspan x="50" y="180">adresse, pays → l&#x27;en-tête obligatoire du</tspan><tspan x="50" y="199">registre. RGPD = toute l&#x27;UE ; format CNIL</tspan><tspan x="50" y="218">en France, autorité locale ailleurs.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Scan des dépenses</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">12-24 mois de débits par compte</tspan><tspan x="435" y="180">(pagination ≤ 50) + factures fournisseurs.</tspan><tspan x="435" y="199">Graphies normalisées et fusionnées ; date</tspan><tspan x="435" y="218">de dernière apparition suivie pour chaque</tspan><tspan x="435" y="237">outil.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Classification des outils</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Chaque SaaS reconnu (culture générale, dès</tspan><tspan x="820" y="180">la 1re occurrence) : données personnelles</tspan><tspan x="820" y="199">? Catégorie, données typiques, siège</tspan><tspan x="820" y="218">UE/hors-UE — tout marqué « à valider ».</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Fiches de traitement</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Regroupement par finalité, pas par</tspan><tspan x="820" y="436">fournisseur : prospection, marketing,</tspan><tspan x="820" y="455">audience, support, RH (indice</tspan><tspan x="820" y="474">list_memberships). Une fiche art. 30 par</tspan><tspan x="820" y="493">traitement, format CNIL.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Drapeaux</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">🔴 hors UE → CCT/adéquation à vérifier · 🟠</tspan><tspan x="435" y="436">DPA à retrouver ou signer · 🟡 disparu des</tspan><tspan x="435" y="455">débits ≥ 6 mois → à sortir ? · 🟡 revendeur</tspan><tspan x="435" y="474">qui masque l&#x27;éditeur → le skill demande.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Registre livré</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Synthèse + fiche par traitement + to-do</tspan><tspan x="50" y="436">priorisée en markdown ; registre HTML</tspan><tspan x="50" y="455">imprimable si l&#x27;hôte affiche les fichiers.</tspan><tspan x="50" y="474">Partout : projet, pas un avis juridique.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>