<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-brand-shield — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · 100% read-only</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Brand inventory</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization (legal name, trade names)</tspan><tspan x="50" y="180">+ list_products (product/service labels) +</tspan><tspan x="50" y="199">domain names spotted in transactions —</tspan><tspan x="50" y="218">each brand tracked separately.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Brand-spend scan</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">12-36 months of debits, paginated ≤ 50:</tspan><tspan x="435" y="180">design &amp; identity, domain names (yearly</tspan><tspan x="435" y="199">cadence), advertising, packaging &amp; print —</tspan><tspan x="435" y="218">counterparties normalized and merged.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Attach to a brand</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Brand name extracted from documents</tspan><tspan x="820" y="180">(get_attachment) or from a domain → 🟢</tspan><tspan x="820" y="199">evidenced; otherwise main brand, 🟡</tspan><tspan x="820" y="218">assumed. Totals per brand, bucket and</tspan><tspan x="820" y="237">period.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">INPI check</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">With the API: exact name + close variants</tspan><tspan x="820" y="436">(registered? owner? classes? renewal?).</tspan><tspan x="820" y="455">Without: pre-filled data.inpi.fr link +</tspan><tspan x="820" y="474">2-min checklist — never scraped, never</tspan><tspan x="820" y="493">guessed.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Suggested Nice classes</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">1-3 classes proposed from real activity</tspan><tspan x="435" y="436">(e.g. SaaS → 42, clothing → 25, retail/ads</tspan><tspan x="435" y="455">→ 35) — always to validate; similarity</tspan><tspan x="435" y="474">stays an indicative alert.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Exposure &amp; pre-filing dossier</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Report: uncovered investment per brand,</tspan><tspan x="50" y="436">close-mark and 10-year renewal alerts,</tspan><tspan x="50" y="455">pre-filing dossier (name, classes,</tspan><tspan x="50" y="474">~€190-270) ready for inpi.fr.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>