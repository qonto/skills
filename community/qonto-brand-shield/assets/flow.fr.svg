<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-brand-shield — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 100 % lecture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Inventaire des marques</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization (raison sociale, noms</tspan><tspan x="50" y="180">commerciaux) + list_products (libellés</tspan><tspan x="50" y="199">produits/services) + domaines repérés dans</tspan><tspan x="50" y="218">les transactions — chaque marque suivie</tspan><tspan x="50" y="237">séparément.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Scan des dépenses de marque</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">12-36 mois de débits, paginés ≤ 50 :</tspan><tspan x="435" y="180">design &amp; identité, noms de domaine</tspan><tspan x="435" y="199">(cadence annuelle), publicité, packaging &amp;</tspan><tspan x="435" y="218">impression — tiers normalisés et</tspan><tspan x="435" y="237">fusionnés.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Rattachement à une marque</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Nom de marque extrait des justificatifs</tspan><tspan x="820" y="180">(get_attachment) ou du domaine → 🟢 prouvé</tspan><tspan x="820" y="199">; sinon marque principale, 🟡 supposé.</tspan><tspan x="820" y="218">Cumul par marque, poste et période.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Vérification INPI</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Avec API : nom exact + variantes (déposée</tspan><tspan x="820" y="436">? par qui ? classes ? renouvellement ?).</tspan><tspan x="820" y="455">Sans : lien data.inpi.fr pré-rempli +</tspan><tspan x="820" y="474">checklist 2 min — jamais de scraping.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Classes de Nice suggérées</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">1-3 classes proposées depuis l&#x27;activité</tspan><tspan x="435" y="436">réelle (ex. SaaS → 42, vêtements → 25,</tspan><tspan x="435" y="455">vente/pub → 35) — toujours à valider ; la</tspan><tspan x="435" y="474">similarité reste une alerte indicative.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Exposition &amp; pré-dossier</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Rapport : investissement à découvert par</tspan><tspan x="50" y="436">marque, alertes marques proches et</tspan><tspan x="50" y="455">renouvellement des 10 ans, dossier de</tspan><tspan x="50" y="474">pré-dépôt (nom, classes, ~190-270 €) prêt</tspan><tspan x="50" y="493">pour inpi.fr.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>