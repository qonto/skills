<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-carbon-ledger — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 0 écriture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Lecture du registre</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization puis 24-36 mois de débits</tspan><tspan x="50" y="180">par compte (pagination ≤ 50), labels et</tspan><tspan x="50" y="199">factures fournisseurs : la matière</tspan><tspan x="50" y="218">première du bilan existe déjà, rien à</tspan><tspan x="50" y="237">saisir.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Périmètre honnête</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">La méthode dépenses couvre biens, services</tspan><tspan x="435" y="180">et énergie. Exclus et annoncés : virements</tspan><tspan x="435" y="199">internes, salaires, impôts, TVA, emprunts,</tspan><tspan x="435" y="218">dividendes — pas de facteur sur les flux</tspan><tspan x="435" y="237">financiers.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Classification par postes</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Contreparties normalisées + labels +</tspan><tspan x="820" y="180">factures → énergie (carburant/élec/gaz),</tspan><tspan x="820" y="199">déplacements (avion/train/route),</tspan><tspan x="820" y="218">numérique &amp; cloud, achats, services,</tspan><tspan x="820" y="237">restauration. « Non classé » visible.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Facteurs monétaires</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Ratios kgCO2e/€ HT type Base Empreinte</tspan><tspan x="820" y="436">ADEME (millésime 2023-2024), embarqués,</tspan><tspan x="820" y="455">chaque ligne avec source et millésime. HT</tspan><tspan x="820" y="474">via vat_amount, sinon ÷ 1,20 annoncé.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Empreinte &amp; tendance</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Total annuel ~N tCO2e avec fourchette ±50</tspan><tspan x="435" y="436">% affichée sur chaque chiffre, répartition</tspan><tspan x="435" y="455">par poste, gros achats ponctuels isolés,</tspan><tspan x="435" y="474">tendance année par année sur 24-36 mois.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">3 leviers chiffrés</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Les 3 actions les plus efficaces au regard</tspan><tspan x="50" y="436">des montants réels, classées par impact</tspan><tspan x="50" y="455">estimé et coût (gratuit / économise /</tspan><tspan x="50" y="474">coûte). Jamais de compensation vendue.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>