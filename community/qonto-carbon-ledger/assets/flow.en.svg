<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-carbon-ledger — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · zero writes</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Read the ledger</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization, then 24-36 months of</tspan><tspan x="50" y="180">debits per account (pagination ≤ 50), plus</tspan><tspan x="50" y="199">labels and supplier invoices: the raw</tspan><tspan x="50" y="218">material already exists, nothing to type</tspan><tspan x="50" y="237">in.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Honest scope</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">The spend-based method covers goods,</tspan><tspan x="435" y="180">services and energy. Excluded and</tspan><tspan x="435" y="199">announced: internal transfers, salaries,</tspan><tspan x="435" y="218">taxes, VAT, loan repayments, dividends —</tspan><tspan x="435" y="237">no factor on financial flows.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Classify into categories</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Normalized counterparties + labels +</tspan><tspan x="820" y="180">invoices → energy (fuel/electricity/gas),</tspan><tspan x="820" y="199">travel (air/rail/road), digital &amp; cloud,</tspan><tspan x="820" y="218">goods, services, catering. Visible</tspan><tspan x="820" y="237">&#x27;unclassified&#x27; bucket.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Monetary factors</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">kgCO2e/€ ratios (ADEME-style spend-based</tspan><tspan x="820" y="436">method, 2023-2024 vintage), embedded,</tspan><tspan x="820" y="455">every line shown with source and vintage.</tspan><tspan x="820" y="474">Net of VAT via vat_amount, else ÷ 1.20</tspan><tspan x="820" y="493">disclosed.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Footprint &amp; trend</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Annual total ~N tCO2e with the ±50% range</tspan><tspan x="435" y="436">printed on every figure, category</tspan><tspan x="435" y="455">breakdown, one-off purchases flagged</tspan><tspan x="435" y="474">apart, year-over-year trend across 24-36</tspan><tspan x="435" y="493">months.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Top-3 levers</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">The 3 most effective actions given the</tspan><tspan x="50" y="436">real amounts, ranked by estimated impact</tspan><tspan x="50" y="455">and cost direction (free / saves / costs</tspan><tspan x="50" y="474">money). Never a carbon offset for sale.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>