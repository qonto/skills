<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-rebill — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 1 écriture = un brouillon</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Cadrage</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord (comptes,</tspan><tspan x="50" y="180">identité), puis les référentiels : labels</tspan><tspan x="50" y="199">Qonto et clients de la facturation,</tspan><tspan x="50" y="218">rapprochés. Période choisie avec</tspan><tspan x="50" y="237">l&#x27;utilisateur (défaut : dernier</tspan><tspan x="50" y="256">trimestre).</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Détection des frais clients</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Scan des débits (paginé ≤ 50, groupé par</tspan><tspan x="435" y="180">emitted_at) : labels « client », équipes,</tspan><tspan x="435" y="199">ou attribution assistée par l&#x27;historique,</tspan><tspan x="435" y="218">transaction par transaction. Jamais</tspan><tspan x="435" y="237">d&#x27;attribution silencieuse.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Regroupement + justificatifs</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Frais groupés par client et par période,</tspan><tspan x="820" y="180">totaux affichés. Chaque ligne :</tspan><tspan x="820" y="199">justificatif déjà attaché récupéré, ou</tspan><tspan x="820" y="218">manque signalé — à compléter avec</tspan><tspan x="820" y="237">qonto-receipt-hunter avant de facturer.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Le choix fiscal</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Débours (au nom du client, sans marge,</tspan><tspan x="820" y="436">hors TVA) ou frais refacturés (TTC, TVA de</tspan><tspan x="820" y="455">la prestation principale) : le skill</tspan><tspan x="820" y="474">explique et demande. Majoration</tspan><tspan x="820" y="493">optionnelle 5-10 % au choix.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Facture en brouillon</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">create_client_invoice en BROUILLON : une</tspan><tspan x="435" y="436">ligne par frais (date, tiers, montant),</tspan><tspan x="435" y="455">TVA selon le régime choisi, ligne « frais</tspan><tspan x="435" y="474">de gestion » séparée si majoration. Rien</tspan><tspan x="435" y="493">n&#x27;est envoyé.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Relecture &amp; envoi</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Relecture ligne à ligne, envoi uniquement</tspan><tspan x="50" y="436">après confirmation explicite. En</tspan><tspan x="50" y="455">répétition : client fictif + brouillon +</tspan><tspan x="50" y="474">delete_client_invoice. Récap final :</tspan><tspan x="50" y="493">montant récupéré.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>