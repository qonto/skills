<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-rebill — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · single write = a draft</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Scope</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first (accounts,</tspan><tspan x="50" y="180">identity), then the referentials: Qonto</tspan><tspan x="50" y="199">labels and invoicing clients, matched</tspan><tspan x="50" y="218">together. Period agreed with the user</tspan><tspan x="50" y="237">(default: last full quarter).</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Detect client expenses</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Debit scan (paginated ≤ 50, grouped by</tspan><tspan x="435" y="180">emitted_at): client-named labels, teams,</tspan><tspan x="435" y="199">or history-assisted attribution, one</tspan><tspan x="435" y="218">transaction at a time. Never a silent</tspan><tspan x="435" y="237">attribution.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Group + receipts</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Expenses grouped by client and period,</tspan><tspan x="820" y="180">totals shown. Each line: the</tspan><tspan x="820" y="199">already-attached receipt retrieved, or the</tspan><tspan x="820" y="218">gap flagged — complete with</tspan><tspan x="820" y="237">qonto-receipt-hunter before invoicing.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">The VAT choice</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Disbursement (client&#x27;s name, no margin,</tspan><tspan x="820" y="436">outside VAT) or rebilled expense (VAT at</tspan><tspan x="820" y="455">the main service&#x27;s rate): the skill</tspan><tspan x="820" y="474">explains and asks. Optional 5-10% handling</tspan><tspan x="820" y="493">fee, user&#x27;s choice.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Draft invoice</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">create_client_invoice as a DRAFT: one line</tspan><tspan x="435" y="436">per expense (date, counterparty, amount),</tspan><tspan x="435" y="455">VAT per the chosen regime, separate</tspan><tspan x="435" y="474">handling-fee line if any. Nothing is sent.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Review &amp; send</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Line-by-line review, sending only after</tspan><tspan x="50" y="436">explicit confirmation. Rehearsals:</tspan><tspan x="50" y="455">fictitious client + draft +</tspan><tspan x="50" y="474">delete_client_invoice. Final recap: money</tspan><tspan x="50" y="493">recovered.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>