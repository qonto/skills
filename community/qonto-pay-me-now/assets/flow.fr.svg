<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-pay-me-now — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · rien ne part sans toi</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Détection des devis acceptés</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord, puis list_quotes</tspan><tspan x="50" y="180">paginé ≤ 50 : devis acceptés croisés avec</tspan><tspan x="50" y="199">list_client_invoices — seuls ceux jamais</tspan><tspan x="50" y="218">facturés remontent, avec client, montant</tspan><tspan x="50" y="237">et date d&#x27;acceptation.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Facture depuis le devis</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">create_client_invoice en BROUILLON :</tspan><tspan x="435" y="180">client, lignes, montants et TVA repris du</tspan><tspan x="435" y="199">devis. Document légal RÉEL — le skill</tspan><tspan x="435" y="218">montre le brouillon et n&#x27;envoie jamais</tspan><tspan x="435" y="237">sans confirmation explicite dans la</tspan><tspan x="435" y="256">conversation.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Payment link Qonto</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">create_payment_link sur le montant de la</tspan><tspan x="820" y="180">facture, numéro dans la description : le</tspan><tspan x="820" y="199">client paie par carte ou virement en un</tspan><tspan x="820" y="218">clic. Vérifié en production le 03/07 — ça</tspan><tspan x="820" y="237">marche via MCP malgré la doc officielle.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Lien court + QR code</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">MCP Short.io présent → create-short-link :</tspan><tspan x="820" y="436">lien court trackable au slug lisible + QR</tspan><tspan x="820" y="455">code proposé pour les factures imprimées.</tspan><tspan x="820" y="474">Sans Short.io, le lien Qonto brut suffit —</tspan><tspan x="820" y="493">le skill le dit et continue.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Envoi maîtrisé</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Avec confirmation explicite :</tspan><tspan x="435" y="436">send_client_invoice et/ou brouillon Gmail</tspan><tspan x="435" y="455">portant le lien de paiement ; sinon texte</tspan><tspan x="435" y="474">prêt à copier. Rien ne part sans</tspan><tspan x="435" y="493">l&#x27;utilisateur, jamais présenté comme</tspan><tspan x="435" y="512">envoyé si en attente.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Suivi &amp; relance douce</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">48 h après : link-statistics (clics),</tspan><tspan x="50" y="436">get_payment_link (statut),</tspan><tspan x="50" y="455">list_transactions (encaissement réel).</tspan><tspan x="50" y="474">Cliqué mais impayé → relance douce</tspan><tspan x="50" y="493">proposée ; payé hors lien → marquage de la</tspan><tspan x="50" y="512">facture proposé.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>