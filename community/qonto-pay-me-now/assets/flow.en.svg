<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-pay-me-now — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · nothing leaves without you</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Spot accepted quotes</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first, then list_quotes</tspan><tspan x="50" y="180">paginated ≤ 50: accepted quotes</tspan><tspan x="50" y="199">cross-checked against list_client_invoices</tspan><tspan x="50" y="218">— only the never-invoiced ones surface,</tspan><tspan x="50" y="237">with client, amount and acceptance date.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Invoice from the quote</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">create_client_invoice as a DRAFT: client,</tspan><tspan x="435" y="180">lines, amounts and VAT carried over from</tspan><tspan x="435" y="199">the quote. A REAL legal document — the</tspan><tspan x="435" y="218">skill shows the draft and never sends</tspan><tspan x="435" y="237">without explicit confirmation in the</tspan><tspan x="435" y="256">conversation.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Qonto payment link</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">create_payment_link on the invoice amount,</tspan><tspan x="820" y="180">number in the description: the client pays</tspan><tspan x="820" y="199">by card or bank transfer in one click.</tspan><tspan x="820" y="218">Verified live in production — it works via</tspan><tspan x="820" y="237">MCP despite the official docs.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Short link + QR code</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Short.io MCP present → create-short-link:</tspan><tspan x="820" y="436">a trackable short link with a readable</tspan><tspan x="820" y="455">slug + a QR code offered for printed</tspan><tspan x="820" y="474">invoices. Without Short.io the raw Qonto</tspan><tspan x="820" y="493">link works — the skill says so and</tspan><tspan x="820" y="512">continues.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Controlled delivery</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">With explicit confirmation:</tspan><tspan x="435" y="436">send_client_invoice and/or a Gmail draft</tspan><tspan x="435" y="455">carrying the payment link; otherwise</tspan><tspan x="435" y="474">copy-ready text. Nothing leaves without</tspan><tspan x="435" y="493">the user, never presented as sent while</tspan><tspan x="435" y="512">pending.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Follow-up &amp; gentle nudge</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">48 h later: link-statistics (clicks),</tspan><tspan x="50" y="436">get_payment_link (status),</tspan><tspan x="50" y="455">list_transactions (real cash in). Clicked</tspan><tspan x="50" y="474">but unpaid → a gentle nudge is proposed;</tspan><tspan x="50" y="493">paid outside the link → invoice marking</tspan><tspan x="50" y="512">proposed.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>