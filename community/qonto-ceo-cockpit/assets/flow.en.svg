<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-ceo-cockpit — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · zero writes</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Discover the account</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first: accounts,</tspan><tspan x="50" y="180">balances, country, company identity. Tax</tspan><tspan x="50" y="199">sub-account detected by name (vault gauge)</tspan><tspan x="50" y="218">and labels read once — nothing hardcoded,</tspan><tspan x="50" y="237">everything comes from the connected</tspan><tspan x="50" y="256">account.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Read the flows (12 months)</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">list_transactions per account, paginated ≤</tspan><tspan x="435" y="180">50 in 3-month windows: inflows grouped by</tspan><tspan x="435" y="199">source (normalized counterparty), outflows</tspan><tspan x="435" y="218">by Qonto label else counterparty, internal</tspan><tspan x="435" y="237">transfers netted out.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Invoices &amp; recurrences</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Unpaid client invoices (each client&#x27;s</tspan><tspan x="820" y="180">usual payment delay factored in), upcoming</tspan><tspan x="820" y="199">supplier invoices, recurring flows</tspan><tspan x="820" y="218">detected (amount ±10 %, M/Q/Y cadence) —</tspan><tspan x="820" y="237">and the day rate detected from day-unit</tspan><tspan x="820" y="256">invoice lines.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">3-month forecast</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Month by month: recurrences on their</tspan><tspan x="820" y="436">typical dates + due invoices + an</tspan><tspan x="820" y="455">irregular-spend baseline (median of past</tspan><tspan x="820" y="474">months). Every figure is tagged 🟢 real or</tspan><tspan x="820" y="493">🟡 estimated — the two layers are never</tspan><tspan x="820" y="512">blended.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Hypotheses embedded</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Day rate and billable days pre-filled from</tspan><tspan x="435" y="436">history, data and formulas shipped as JSON</tspan><tspan x="435" y="455">inside the page: moving a slider</tspan><tspan x="435" y="474">recalculates the projection in JS,</tspan><tspan x="435" y="493">instantly, without a single new Qonto MCP</tspan><tspan x="435" y="512">call.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Cockpit rendered</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">One self-contained HTML file: flow view,</tspan><tspan x="50" y="436">month/year/forecast cards, sliders, eye</tspan><tspan x="50" y="455">toggle 👁 to present without showing</tspan><tspan x="50" y="474">everything. Zero external dependency.</tspan><tspan x="50" y="493">Fallback: structured markdown tables.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>