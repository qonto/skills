<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-ceo-cockpit — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 0 écriture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Découverte du compte</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord : comptes,</tspan><tspan x="50" y="180">soldes, pays, identité de la société.</tspan><tspan x="50" y="199">Détection du sous-compte impôts (jauge du</tspan><tspan x="50" y="218">coffre) et lecture des labels — zéro</tspan><tspan x="50" y="237">donnée en dur, tout vient du compte</tspan><tspan x="50" y="256">connecté.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Lecture des flux (12 mois)</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">list_transactions par compte, paginé ≤ 50</tspan><tspan x="435" y="180">par fenêtres de 3 mois : entrées par</tspan><tspan x="435" y="199">source (contrepartie normalisée), sorties</tspan><tspan x="435" y="218">par label Qonto sinon par contrepartie,</tspan><tspan x="435" y="237">virements internes neutralisés.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Factures &amp; récurrences</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Factures clients impayées (retard habituel</tspan><tspan x="820" y="180">du client intégré), factures fournisseurs</tspan><tspan x="820" y="199">à venir, récurrences détectées (montant</tspan><tspan x="820" y="218">±10 %, cadence M/T/A) — et TJM détecté sur</tspan><tspan x="820" y="237">les lignes de factures à la journée.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Prévisionnel 3 mois</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Mois par mois : récurrences aux dates</tspan><tspan x="820" y="436">typiques + factures dues + base</tspan><tspan x="820" y="455">irrégulière (médiane des mois passés).</tspan><tspan x="820" y="474">Chaque montant est tagué 🟢 réel ou 🟡</tspan><tspan x="820" y="493">estimé — le cockpit ne mélange jamais les</tspan><tspan x="820" y="512">deux couches.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Hypothèses embarquées</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">TJM et jours facturables pré-remplis</tspan><tspan x="435" y="436">depuis l&#x27;historique, données et formules</tspan><tspan x="435" y="455">en JSON dans la page : bouger un slider</tspan><tspan x="435" y="474">recalcule la projection en JS,</tspan><tspan x="435" y="493">instantanément, sans aucun rappel du MCP</tspan><tspan x="435" y="512">Qonto.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Cockpit généré</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Un fichier HTML autoportant : vue des</tspan><tspan x="50" y="436">flux, cartes mois/année/prévisionnel,</tspan><tspan x="50" y="455">sliders, œil 👁 de masquage pour présenter</tspan><tspan x="50" y="474">sans tout montrer. Zéro dépendance</tspan><tspan x="50" y="493">externe. Repli : tableaux markdown</tspan><tspan x="50" y="512">structurés.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>