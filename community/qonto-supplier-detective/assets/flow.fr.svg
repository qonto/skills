<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-supplier-detective — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 100 % lecture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Balayage &amp; normalisation</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Toutes les factures fournisseurs et tous</tspan><tspan x="50" y="180">les débits (12-24 mois), paginés ≤ 50.</tspan><tspan x="50" y="199">Noms normalisés (mentions SEPA, suffixes</tspan><tspan x="50" y="218">SARL/SAS), numéros de facture nettoyés,</tspan><tspan x="50" y="237">avoirs et remboursements identifiés</tspan><tspan x="50" y="256">d&#x27;emblée.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Doublons de factures</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Signal natif has_duplicates vérifié +</tspan><tspan x="435" y="180">passe propre : même fournisseur et même</tspan><tspan x="435" y="199">montant à 45 jours, ou même numéro de</tspan><tspan x="435" y="218">facture. Les abonnements sont écartés par</tspan><tspan x="435" y="237">leur cadence — même montant chaque mois ≠</tspan><tspan x="435" y="256">doublon.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Payés-deux-fois</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Une facture rapprochée de deux débits, ou</tspan><tspan x="820" y="180">deux factures jumelles payées chacune.</tspan><tspan x="820" y="199">Paiements partiels et acomptes blanchis</tspan><tspan x="820" y="218">d&#x27;abord : un vrai payé-deux-fois totalise</tspan><tspan x="820" y="237">environ deux fois le montant facturé.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Écarts facture ↔ paiement</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Payé plus que facturé au-delà de 0,05 €</tspan><tspan x="820" y="436">d&#x27;arrondi : trop-versé présumé, avec les</tspan><tspan x="820" y="455">deux références. Avoirs et remboursements</tspan><tspan x="820" y="474">recherchés avant de conclure ; devises</tspan><tspan x="820" y="493">étrangères signalées « à vérifier ».</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Vigie IBAN 🚨</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Fournisseur connu payé sur l&#x27;IBAN A qui</tspan><tspan x="435" y="436">présente soudain l&#x27;IBAN B : alerte</tspan><tspan x="435" y="455">sécurité épinglée en tête — pattern n°1 de</tspan><tspan x="435" y="474">la fraude au RIB. Consigne : vérifier par</tspan><tspan x="435" y="493">téléphone au numéro connu, jamais celui de</tspan><tspan x="435" y="512">l&#x27;email.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Rapport de recouvrement</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Anomalies classées par montant récupérable</tspan><tspan x="50" y="436">avec preuves (numéro de facture,</tspan><tspan x="50" y="455">références de virement, dates), total à</tspan><tspan x="50" y="474">réclamer estimé, cas blanchis affichés,</tspan><tspan x="50" y="493">e-mails de réclamation sur demande. Zéro</tspan><tspan x="50" y="512">écriture.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>