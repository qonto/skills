<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-supplier-detective — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · 100% read-only</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Sweep &amp; normalize</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">Every supplier invoice and every debit</tspan><tspan x="50" y="180">(12–24 months), paginated ≤ 50. Supplier</tspan><tspan x="50" y="199">names normalized (SEPA noise, SARL/SAS</tspan><tspan x="50" y="218">suffixes), invoice numbers cleaned, credit</tspan><tspan x="50" y="237">notes and refunds identified up front.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Duplicate invoices</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Native has_duplicates signal</tspan><tspan x="435" y="180">double-checked + an own pass: same</tspan><tspan x="435" y="199">supplier and same amount within 45 days,</tspan><tspan x="435" y="218">or same invoice number. Subscriptions</tspan><tspan x="435" y="237">excluded by cadence — same amount every</tspan><tspan x="435" y="256">month ≠ duplicate.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Paid twice</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">One invoice matched to two debits, or two</tspan><tspan x="820" y="180">twin invoices each paid. Partial payments</tspan><tspan x="820" y="199">and deposits cleared first: a true double</tspan><tspan x="820" y="218">payment totals about twice the invoiced</tspan><tspan x="820" y="237">amount — that&#x27;s the money finder.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Invoice ↔ payment gaps</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Paid more than invoiced beyond €0.05</tspan><tspan x="820" y="436">rounding: presumed overpayment, with both</tspan><tspan x="820" y="455">references. Credit notes and refunds</tspan><tspan x="820" y="474">searched before flagging; foreign-currency</tspan><tspan x="820" y="493">invoices reported as “to verify (FX)”.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">IBAN watch 🚨</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">A known supplier paid on IBAN A suddenly</tspan><tspan x="435" y="436">showing IBAN B: a security alert pinned on</tspan><tspan x="435" y="455">top — the number-one wire-fraud pattern.</tspan><tspan x="435" y="474">Instruction: verify by phone at the</tspan><tspan x="435" y="493">already-known number, never the email&#x27;s.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Recovery report</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Findings ranked by recoverable amount with</tspan><tspan x="50" y="436">evidence (invoice number, transfer</tspan><tspan x="50" y="455">references, dates), estimated total to</tspan><tspan x="50" y="474">claim, cleared cases shown, claim emails</tspan><tspan x="50" y="493">drafted on request. Zero writes anywhere.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>