<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-subscription-guardian — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · single write</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Map the account</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first (accounts,</tspan><tspan x="50" y="180">country), then existing cards via</tspan><tspan x="50" y="199">list_cards: SUB- cards recognized (never</tspan><tspan x="50" y="218">proposed twice) and the count checked</tspan><tspan x="50" y="237">against the plan grid.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Light detection (24–36 months)</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Paginated transactions across 24–36 months</tspan><tspan x="435" y="180">— wide enough for yearly ones: normalized</tspan><tspan x="435" y="199">counterparty, monthly/quarterly/yearly</tspan><tspan x="435" y="218">cadence, amount ±15 %. A candidate list,</tspan><tspan x="435" y="237">no verdicts.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Plan reminder</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Public grid: Basic 2 virtual cards</tspan><tspan x="820" y="180">included · Smart/Premium 50 ·</tspan><tspan x="820" y="199">Essential/Business/Enterprise unlimited.</tspan><tspan x="820" y="218">Plan not readable via MCP: the skill asks</tspan><tspan x="820" y="237">yours and sizes the proposal.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">The user picks</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">You choose the subscriptions to protect,</tspan><tspan x="820" y="436">one by one — never a bulk run. For the</tspan><tspan x="820" y="455">full audit (annual cost, duplicates,</tspan><tspan x="820" y="474">increases), see the</tspan><tspan x="820" y="493">qonto-subscription-audit skill.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">One capped card per subscription</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Virtual create_card: monthly cap = current</tspan><tspan x="435" y="436">price + a small margin (yearly:</tspan><tspan x="435" y="455">per-transaction cap). Explicit consent +</tspan><tspan x="435" y="474">SCA for EACH card — the call blocks until</tspan><tspan x="435" y="493">the push is confirmed.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Name it, switch it</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">update_card sets the SUB-&lt;Vendor&gt;</tspan><tspan x="50" y="436">nickname, then one manual step: switch the</tspan><tspan x="50" y="455">payment method at the vendor — card number</tspan><tspan x="50" y="474">rendered for your eyes only. Final recap.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>