<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-subscription-guardian — Fonctionnement global</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 étapes · 1 seule écriture</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Cartographie du compte</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization d&#x27;abord (comptes, pays),</tspan><tspan x="50" y="180">puis les cartes existantes via list_cards</tspan><tspan x="50" y="199">: cartes SUB- reconnues (jamais</tspan><tspan x="50" y="218">reproposées) et comptage face à la grille</tspan><tspan x="50" y="237">du plan.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Détection légère (24-36 mois)</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">Transactions paginées sur 24-36 mois —</tspan><tspan x="435" y="180">assez pour les annuels : contrepartie</tspan><tspan x="435" y="199">normalisée, cadence</tspan><tspan x="435" y="218">mensuelle/trimestrielle/annuelle, montant</tspan><tspan x="435" y="237">±15 %. Une liste de candidats, aucun</tspan><tspan x="435" y="256">verdict.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Rappel du plan</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Grille publique : Basic 2 cartes incluses</tspan><tspan x="820" y="180">· Smart/Premium 50 ·</tspan><tspan x="820" y="199">Essential/Business/Enterprise illimité.</tspan><tspan x="820" y="218">Plan non lisible via MCP : le skill</tspan><tspan x="820" y="237">demande le tien et adapte le nombre de</tspan><tspan x="820" y="256">cartes.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Choix de l&#x27;utilisateur</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Tu choisis les abonnements à protéger, un</tspan><tspan x="820" y="436">par un — jamais de rafale. Pour l&#x27;audit</tspan><tspan x="820" y="455">complet (coût annuel, doublons, hausses),</tspan><tspan x="820" y="474">c&#x27;est le skill qonto-subscription-audit.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Carte plafonnée par abonnement</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">create_card virtuelle : plafond mensuel =</tspan><tspan x="435" y="436">prix actuel + petite marge (annuel :</tspan><tspan x="435" y="455">plafond par transaction). Consentement</tspan><tspan x="435" y="474">explicite + SCA pour CHAQUE carte —</tspan><tspan x="435" y="493">l&#x27;appel bloque jusqu&#x27;au push.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Nommage et bascule</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">update_card pose le nickname</tspan><tspan x="50" y="436">SUB-&lt;Fournisseur&gt;, puis étape manuelle :</tspan><tspan x="50" y="455">changer le moyen de paiement chez le</tspan><tspan x="50" y="474">fournisseur — numéro affiché pour tes yeux</tspan><tspan x="50" y="493">uniquement. Récap final.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>