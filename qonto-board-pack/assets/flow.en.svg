<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1160" height="620" rx="18" fill="#1D1B29"/><text x="30" y="46" font-size="24" font-weight="800" fill="#FFFFFF">qonto-board-pack — How it works</text><rect x="892" y="24" width="238" height="32" rx="16" fill="#6B4EFF"/><text x="1011" y="45" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 steps · zero Qonto writes</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6B4EFF"/></marker></defs><rect x="30" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="60" cy="127" r="16" fill="#6B4EFF"/><text x="60" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="86" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">Frame &amp; audience</text><text font-size="12.5" fill="#4A4661"><tspan x="50" y="161">get_organization first: accounts,</tspan><tspan x="50" y="180">balances, target month. The user picks the</tspan><tspan x="50" y="199">audience — banker, investor or internal</tspan><tspan x="50" y="218">team — and the detail level: exact figures</tspan><tspan x="50" y="237">or trends only.</tspan></text><rect x="415" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="127" r="16" fill="#6B4EFF"/><text x="445" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="471" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">The month&#x27;s numbers</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="161">list_transactions paginated ≤ 50, internal</tspan><tspan x="435" y="180">transfers excluded: cash in, spend by</tspan><tspan x="435" y="199">category (labels), end-of-month cash</tspan><tspan x="435" y="218">(official statement), net burn and runway</tspan><tspan x="435" y="237">computed.</tspan></text><rect x="800" y="95" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="127" r="16" fill="#6B4EFF"/><text x="830" y="133" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="856" y="133" font-size="16.5" font-weight="800" fill="#1D1B29">M-1 &amp; rolling-year compare</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="161">Same metrics for the previous month and</tspan><tspan x="820" y="180">the trailing year: deltas in amount and %,</tspan><tspan x="820" y="199">seasonality flagged, receivables as a</tspan><tspan x="820" y="218">forward signal — never a trend from one</tspan><tspan x="820" y="237">month.</tspan></text><rect x="800" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="830" cy="383" r="16" fill="#6B4EFF"/><text x="830" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Detected highlights</text><text font-size="12.5" fill="#4A4661"><tspan x="820" y="417">Found in the data, not invented: big</tspan><tspan x="820" y="436">contract collected, new significant</tspan><tspan x="820" y="455">expense, missing recurring client payment,</tspan><tspan x="820" y="474">category spike — every fact cites its</tspan><tspan x="820" y="493">transactions.</tspan></text><rect x="415" y="351" width="330" height="186" rx="14" fill="#FFFFFF" stroke="#6B4EFF" stroke-width="2"/><circle cx="445" cy="383" r="16" fill="#6B4EFF"/><text x="445" y="389" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="471" y="389" font-size="16.5" font-weight="800" fill="#1D1B29">Executive narrative</text><text font-size="12.5" fill="#4A4661"><tspan x="435" y="417">Three written paragraphs — highlights,</tspan><tspan x="435" y="436">numbers, outlook — factual tone, neither</tspan><tspan x="435" y="455">salesy nor alarmist. Hard stop: the user</tspan><tspan x="435" y="474">reviews and edits BEFORE any formatting</tspan><tspan x="435" y="493">happens.</tspan></text><rect x="30" y="351" width="330" height="186" rx="14" fill="#6B4EFF" stroke="#4A30D9" stroke-width="2"/><circle cx="60" cy="383" r="16" fill="#FFFFFF"/><text x="60" y="389" font-size="16" font-weight="800" fill="#6B4EFF" text-anchor="middle">6</text><text x="86" y="389" font-size="16.5" font-weight="800" fill="#FFFFFF">Pack &amp; send email</text><text font-size="12.5" fill="#F1EDFF"><tspan x="50" y="417">Self-contained 5-6 slide HTML deck (or</tspan><tspan x="50" y="436">Canva when that MCP is present) + the</tspan><tspan x="50" y="455">email written (Gmail draft when present).</tspan><tspan x="50" y="474">Nothing is ever sent: the user reviews and</tspan><tspan x="50" y="493">sends.</tspan></text><line x1="360" y1="188.0" x2="409" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="745" y1="188.0" x2="794" y2="188.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="965.0" y1="281" x2="965.0" y2="345" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="800" y1="444.0" x2="753" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="444.0" x2="368" y2="444.0" stroke="#6B4EFF" stroke-width="3" marker-end="url(#ar)"/></svg>